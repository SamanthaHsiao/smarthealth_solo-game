<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Una semana en el consultorio｜Recepción y recordatorios</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1d2b29;--mute:#6b7d79;--brand:#1f8a70;--warn:#d9534f;--line:#d7e3df;--soft:#eef5f2;--gold:#f0a924}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;color:var(--ink);overflow-x:hidden;-webkit-tap-highlight-color:transparent;
  background:linear-gradient(120deg,#e4f5ee,#f4f7f6,#e7f0fb);min-height:100vh}
#app{max-width:480px;margin:0 auto;padding:12px 14px 40px}
h1,h2,h3{margin:.2em 0}
button{font:inherit;border:0;border-radius:14px;padding:14px 12px;background:var(--brand);color:#fff;cursor:pointer;width:100%;font-size:17px;margin-top:6px;transition:transform .08s}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 var(--line)}
.card.no{background:#fdf3f2;border-color:#f0c4c0}
.muted{color:var(--mute);font-size:14px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.hud{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--mute);margin-bottom:6px;padding-right:58px}   /* Espacio reservado arriba a la derecha para el botón 🔊 */
.hud b{color:var(--ink);font-size:18px}
.stars{color:var(--gold);font-size:20px;letter-spacing:2px;display:inline-block}
.stars.pulse{animation:pop .5s}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:.3}100%{transform:scale(1);opacity:1}}
.event{display:inline-block;background:#fff3cf;border:1px solid var(--gold);border-radius:999px;padding:6px 12px;font-size:14px;margin-bottom:10px}
.note{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 10px;font-size:14px;margin:8px 0 12px;min-height:38px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--brand);margin:2px 4px 0 0}
.tag.warn{background:#fdecea;color:var(--warn)}
.bubble{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:16px;padding:6px 10px;font-size:14px;margin-top:6px;max-width:100%;position:relative}
.complaint{background:#fdecea;color:#9b2c27;border:2px solid #f0c4c0;border-radius:16px;padding:8px 10px;font-size:15px;margin-bottom:10px;text-align:center;font-weight:700;animation:pop .35s}
/* 櫃台 */
.counter-scene{background:linear-gradient(#dff2ea,#f4f7f6 70%);border-radius:24px;padding:10px;margin-bottom:6px;border:2px solid #bfe0d2}
.rulebox{background:#2f5d50;color:#fff;border:none;border-radius:16px;box-shadow:0 5px 0 #1d3f36;padding:10px 12px;text-align:center;margin-bottom:12px}
.rulebox .muted{color:#bfe0d6}
.rule{animation:pop .4s}
.rule.still{animation:none}
.ticket{background:#fffdf5;border:2px dashed #d8c9a3;border-radius:12px;padding:12px 14px 8px;position:relative;color:#2f5d50;margin:10px 0 12px}
.ticket .hole{position:absolute;top:-9px;left:50%;transform:translateX(-50%);width:34px;height:14px;border-radius:0 0 14px 14px;background:#2f5d50}
.ticket h4{margin:2px 0 6px;text-align:center;font-size:13px;color:#8a7a52;letter-spacing:1px}
.trow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dotted #cdbd93;padding:7px 2px;font-size:15px;font-weight:700}
.trow:last-child{border-bottom:none}
.trow b{font-size:19px;font-weight:900}
.tfoot{text-align:center;font-size:12px;color:#8a7a52;margin-top:4px}
.sticky{background:#ffe9a8;color:#6b4e00;border-radius:4px 4px 14px 4px;padding:8px 12px;transform:rotate(-1.2deg);box-shadow:0 3px 0 rgba(0,0,0,.2);font-weight:700;font-size:14px;margin:4px auto 10px;max-width:300px}
.ptag{display:inline-block;background:#fff;color:#6b8f85;border:2px dashed #bfe0d6;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;margin:2px}
.ptag.on{background:#ffeab5;color:#6b4e00;border:2px solid #f0a924}
.jump{background:#fff6dc;border:2px solid #f0c24b;border-radius:14px;padding:8px 10px;margin-bottom:8px;text-align:center;font-size:15px;animation:pop .35s}
.jump .btns{margin-top:6px}
.or{text-align:center;font-size:12px;color:#8a7a52;font-weight:800;margin:-2px 0}
.sticky.closed{background:#ffd6d6;color:#8a1f1f}
.pick{display:flex;align-items:center;gap:10px;justify-content:flex-start;width:100%;margin:6px 0}
[data-drag]{touch-action:none;cursor:grab}
#app{padding-bottom:240px}
.zones{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#e9f6f1;border-top:2px solid #bfe0d6;padding:6px 8px 10px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px;box-shadow:0 -4px 12px rgba(0,0,0,.08)}
.zone{background:#fff;border:2px dashed #8fc9b5;border-radius:12px;padding:8px 2px;font-weight:800;color:#2f5d50;font-size:15px;text-align:center;transition:background .15s;min-height:84px;display:flex;align-items:center;justify-content:center}
.pzones{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0}
.pzones .zone{min-height:64px;font-size:15px;touch-action:none}
.rsum{display:flex;gap:8px;margin:4px 0 8px}
.rbig{flex:1;background:#fff;border:2px solid #cfe7dc;border-radius:16px;padding:8px;text-align:center;box-shadow:0 3px 8px rgba(0,0,0,.06);animation:tileIn .5s ease both}
.rbig:last-child{animation-delay:.15s}
.rnum{display:block;font-size:34px;font-weight:900;color:#2f7d62;line-height:1.1}
.rnum small{font-size:16px;color:#6b8f85}
.rbig small{font-size:13px;font-weight:700;color:#4d7a6c}
.rnote{width:100%;text-align:center;font-size:12px;color:#6b8f85}
.tile{animation:tileIn .45s ease both}
.tilegrid .tile{animation:none}
.tilegrid .tile.new{animation:tileIn .45s ease both}
.tile.hid{background:#f3efe6;border-style:dashed}
.tile.hid span{color:#9a9a9a}
.rface{display:block;font-style:normal;font-size:28px;line-height:1.1}
@keyframes tileIn{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
.zone.hold{background:#fff7e0;border-color:#f0a924;color:#7a5200}
.zone.door{background:#ffe1e1;border-color:#e0a0a0;color:#8a1f1f}
.zone.over{background:#ffeab5;border-color:#f0a924;transform:scale(1.03)}
.cas small{display:block;font-size:12px;color:#8a1f1f;margin:2px 0}
.zone.closed{background:#eeeeee;border:2px solid #d9534f;color:#8a1f1f;text-decoration:none}
.lane{display:flex;gap:6px;overflow-x:auto;padding:8px;background:#e6f3ee;border-radius:12px;margin:8px 0}
.slot{min-width:78px;background:#fff;border-radius:10px;padding:4px;text-align:center;border:2px dashed #bfe0d6;touch-action:none;cursor:grab}
.slot small{display:block;font-size:11px;font-weight:700}
.slot .bar,.bed .bar,.cas .bar{height:6px;margin-top:4px}
.disaster{background:#fff1f1;border:2px solid #e0a0a0;border-radius:14px;padding:8px;margin:8px 0;color:#8a1f1f}
.disaster h4{margin:0 0 6px;text-align:center}
.beds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bed{background:#fff;border:2px dashed #e0a0a0;border-radius:10px;padding:6px;text-align:center;font-weight:800;font-size:13px;min-height:70px}
.bed.on{border-style:solid;background:#ffe9e9}
.bed small{display:block;font-size:11px;color:#a06060}
.cas-row{display:flex;gap:6px;justify-content:center;margin-top:6px;flex-wrap:wrap}
.cas{background:#fff;border:2px solid #d9534f;border-radius:10px;padding:6px 8px;font-weight:800;font-size:13px;touch-action:none;cursor:grab;min-width:110px;text-align:center}
.dragtip{grid-column:1 / -1;font-size:12px;color:#6b8f85;text-align:center;font-weight:700;margin-bottom:2px}
/* 分數變化：明顯的加減分提示 */
.scorechip{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:999px;font-weight:900;font-size:14px;color:#fff;animation:scpop .5s ease-out}
.scorechip.pos{background:#1f8a70}
.scorechip.neg{background:#d9534f}
@keyframes scpop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.scorehist{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px;font-size:12px;font-weight:800}
.scorehist span{padding:2px 8px;border-radius:999px;background:#f4f7f6;border:1px solid #d7e3df;max-width:100%}
.scorehist span.pos{color:#1f6f58;border-color:#9fd6c2;background:#e4f7ea}
.scorehist span.neg{color:#8a1f1f;border-color:#f0b4b4;background:#fdeaea}
/* 第三天：緊湊版面，減少上下捲動 */
.prow{display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:2px solid #d7e3df;border-radius:12px;padding:6px 8px;margin:6px 0}
.pinfo{min-width:0;flex:1}
.pinfo b{font-size:15px;display:block}
.pinfo small{font-size:12px;color:#5a7a72;font-weight:700;line-height:1.35}
.pbtns{display:flex;gap:6px;flex-shrink:0}
.pbtns button{font-size:13px;padding:7px 9px;margin:0;border-radius:10px}
button.ghostbtn{background:#fff;color:#2f5d50;border:2px solid #d7e3df}
.candlist{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.candcard{flex:0 0 auto;min-width:130px}
.slotdrop{padding:6px 8px;margin:4px 0}
.msgcard{padding:6px;margin:6px 0}
.msgcard .acts{gap:4px}
button,[data-act]{touch-action:manipulation;-webkit-user-select:none;user-select:none}
[data-drag],[data-cas],[data-slot],[data-cand],[data-slotdrop]{touch-action:none;-webkit-user-select:none;user-select:none}
.ghost{position:fixed;z-index:90;pointer-events:none;width:220px;opacity:.92;transform:rotate(-3deg);box-shadow:0 12px 24px rgba(0,0,0,.25);margin:0}
.emg{background:#d9534f;color:#fff;border-radius:10px;padding:4px 8px;font-weight:800;text-align:center;margin-bottom:6px;animation:pop .4s}
.pills{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pill{font-size:12px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.18);color:#e6f4ef}
.pill.on{background:#fff;color:#2f5d50;font-weight:700}
.pcard{border:2px solid #cfe3dc;box-shadow:0 4px 0 #cfe3dc;background:linear-gradient(#fffdf6,#fff);border-radius:20px;padding:12px;min-height:170px}
.pcard.arrive{animation:arrive .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes arrive{from{transform:translateY(-14px) scale(.96);opacity:0}to{transform:none;opacity:1}}
.fields{display:flex;flex-direction:column;gap:4px;margin-top:6px;font-size:16px}
.fields span{padding:2px 8px;border-radius:10px;background:#f3f8f6;width:fit-content}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#1f8a70,#5cc4a0);border-radius:8px}
.bar i.low{background:linear-gradient(90deg,#d9534f,#f0a924)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btns button{font-size:22px;padding:22px 8px;box-shadow:0 5px 0 rgba(0,0,0,.18)}
.btns button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btns .deny{background:var(--warn)}
.queue{display:flex;align-items:flex-end;gap:2px;margin-top:12px;min-height:44px}
.qp{display:inline-block}
.av{display:block;overflow:visible}
.av.sm{width:56px;height:77px}
.av.xs{width:34px;height:47px}
.staffrow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.staffrow .bubble{font-size:14px;margin-top:0}
.walk .av{animation:bob .6s ease-in-out infinite alternate}
.walk .swing-l{animation:swingL .6s ease-in-out infinite alternate}
.walk .swing-r{animation:swingR .6s ease-in-out infinite alternate}
.swing-l,.swing-r{transform-box:view-box}
@keyframes bob{to{transform:translateY(-3px)}}
@keyframes swingL{to{transform:rotate(-20deg)}}
@keyframes swingR{to{transform:rotate(20deg)}}
.happy-bounce .av{animation:hop .6s ease-in-out 2}
@keyframes hop{50%{transform:translateY(-8px)}}
/* 提醒 */
.odds{font-size:13px;color:var(--mute);margin-top:6px}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.seg button{background:#fff;color:var(--ink);border:2px solid var(--line);font-size:14px;padding:10px 4px;margin:0}
.seg button.on{background:var(--soft);border-color:var(--brand);color:var(--brand);font-weight:700}
.seg small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.seg button.on small{color:var(--brand)}
/* 升級 */
.up{display:block;text-align:left;background:#fff;color:var(--ink);border:2px solid var(--brand);border-radius:18px;padding:14px;margin-bottom:10px;font-size:18px;font-weight:700;box-shadow:0 4px 0 var(--brand)}
.up small{display:block;color:var(--mute);font-size:14px;margin-top:4px;font-weight:normal}
.up:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand)}
/* 特效 */
.fx-ok{animation:okp .8s ease-out}
@keyframes okp{0%{box-shadow:0 0 0 0 rgba(31,138,112,.7)}100%{box-shadow:0 0 0 18px rgba(31,138,112,0)}}
.fx-bad{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.float{position:fixed;pointer-events:none;font-weight:800;font-size:24px;animation:floatup 1.2s ease-out forwards;z-index:50;text-shadow:0 2px 0 #fff}
@keyframes floatup{to{transform:translateY(-60px);opacity:0}}
.stamp{position:fixed;left:50%;top:40%;font-size:46px;font-weight:900;border:5px solid;padding:6px 18px;border-radius:14px;z-index:70;pointer-events:none;background:rgba(255,255,255,.8);transform:translate(-50%,-50%) rotate(-12deg);animation:stampin .7s ease-out forwards}
.stamp.ok{color:var(--brand);border-color:var(--brand)}
.stamp.bad{color:var(--warn);border-color:var(--warn)}
@keyframes stampin{0%{transform:translate(-50%,-50%) scale(2.2) rotate(-12deg);opacity:0}30%{opacity:1}100%{transform:translate(-50%,-50%) scale(1) rotate(-12deg);opacity:0}}
.burst{position:fixed;left:50%;top:22%;transform:translateX(-50%);font-size:30px;font-weight:900;color:#fff;background:linear-gradient(90deg,#f0a924,#e0557a,#7b5cd6);padding:10px 22px;border-radius:999px;z-index:75;white-space:nowrap;pointer-events:none;animation:burstin 1.1s ease-out forwards;box-shadow:0 6px 0 rgba(0,0,0,.15)}
@keyframes burstin{0%{transform:translateX(-50%) scale(.3);opacity:0}20%{transform:translateX(-50%) scale(1.15);opacity:1}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{transform:translateX(-50%) translateY(-20px);opacity:0}}
.conf{position:fixed;top:-20px;width:9px;height:13px;z-index:60;animation:fall 2.6s linear forwards;border-radius:2px}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.ghost-p{position:fixed;z-index:45;pointer-events:none;display:flex;flex-direction:column;align-items:center;animation:outR .9s ease-in forwards}
.ghost-p.gl{animation-name:outL}
.ghost-p .gbubble{background:#fff;border:2px solid var(--line);border-radius:14px;padding:4px 10px;font-size:14px;white-space:nowrap;margin-bottom:4px;font-weight:700}
@keyframes outR{0%{transform:none;opacity:1}100%{transform:translateX(160px) rotate(8deg);opacity:0}}
@keyframes outL{0%{transform:none;opacity:1}30%{transform:translateX(-10px)}100%{transform:translateX(-170px) rotate(-6deg);opacity:0}}
.mute{position:fixed;top:8px;right:8px;width:auto;margin:0;padding:6px 12px;font-size:18px;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:999px;z-index:80}
.marquee{display:flex;gap:18px;justify-content:center;align-items:flex-end;margin:6px 0 14px}

/* v15：縮小看診條件區，讓病人卡和分診區更突出 */
.rulebox{padding:6px 8px;margin-bottom:6px}
.ticket{padding:6px 10px 4px;margin:4px 0 6px}
.ticket h4{font-size:12px;margin:0 0 2px}
.trow{padding:3px 2px;font-size:14px}
.trow b{font-size:16px}
.tfoot{display:none}
.sticky{font-size:12px;padding:4px 10px;margin:2px auto 5px;max-width:320px}
.ptag{font-size:11px;padding:1px 7px;margin:1px}
.staffrow{margin-bottom:4px}
.staffrow .av.sm{width:44px;height:61px}
.staffrow .bubble{font-size:12px;padding:4px 10px}
.pcard{padding:8px 10px}
.pcard .bubble{font-size:13px}
.zone{min-height:84px;font-size:19px;border-width:3px}
.zones{padding:6px 8px 8px}
.dragtip{font-size:11px}
#app{padding-bottom:240px}
.note:empty{display:none}
.pair{background:#fff;border-radius:16px;padding:10px;margin:6px 0;box-shadow:0 4px 0 #bfd9cf;animation:pop .35s}
.pair.still{animation:none}
.pair-h{text-align:center;font-size:16px;font-weight:900;color:#2f5d50;margin-bottom:8px}
.pair-row{display:flex;gap:10px}
.pcand{flex:1;min-width:0;border-radius:16px;padding:8px 6px;text-align:center;border:3px solid;cursor:pointer;background:#fff;display:flex;flex-direction:column;align-items:center;gap:2px}
.pcand:active{transform:scale(.97)}
.pcand.u1{border-color:#7bc47f;background:#f1fbf1}
.pcand.u2{border-color:#f0a924;background:#fff7e4}
.pcand.u3{border-color:#d9534f;background:#ffeeee}
.pcand .cu{font-size:13px;font-weight:900;color:#2f5d50}
.pcand b{font-size:16px}
.pcand small{font-size:12px;color:#5a7a72;font-weight:700}
.pcand .cost{color:#8a1f1f}
.cbar{width:100%;height:8px;background:#e3ece9;border-radius:999px;overflow:hidden;margin:2px 0}
.cbar i{display:block;height:100%;background:#1f8a70}
.bar.big{height:10px;margin-top:8px}

/* v18：第三天 START 檢傷 */
.zones.tri{grid-template-columns:repeat(3,1fr)}
.zone.tri-red{background:#ffe1e1;border-color:#d9534f;color:#8a1f1f}
.zone.tri-yellow{background:#fff3c4;border-color:#f0a924;color:#7a5200}
.zone.tri-green{background:#dff5e3;border-color:#5cb85c;color:#1f5f2a}
.judge{border-radius:14px;padding:8px 10px;margin:6px 0;font-size:14px;font-weight:700;line-height:1.5;animation:pop .3s}
.judge b{font-size:15px}
.judge.ok{background:#e4f7ea;border:2px solid #5cb85c;color:#1f5f2a}
.judge.bad{background:#ffe9e9;border:2px solid #d9534f;color:#8a1f1f}
.judge.idle{background:#fff;border:2px dashed #bfe0d6;color:#5a7a72;text-align:center}
.tcard{background:#fff;border:2px solid #d7e3df;border-radius:14px;padding:8px 10px;margin:6px 0;touch-action:none;cursor:grab}
.tcard .thead{display:flex;justify-content:space-between;align-items:center;font-size:16px}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:4px;font-size:13px;margin:6px 0;font-weight:700}
.clues .warn{color:#d9534f}
.tcard .bar{height:6px}
.rooms-h{font-size:13px;font-weight:900;color:#6b4e00;margin:8px 0 4px;text-align:center}
.bays{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bay{background:#fff;border:2px dashed #e0a0a0;border-radius:10px;padding:6px;text-align:center;font-weight:800;font-size:13px;min-height:72px}
.bay.on{border-style:solid;background:#ffe9e9}
.bay small{display:block;font-weight:700;font-size:11px;color:#a06060}
.bay .bar{height:6px}
.bed{background:#fdf6ea;border:2px solid #e8c9a0;border-radius:14px 14px 10px 10px;padding:3px 5px 4px;text-align:center;min-width:0}
.bed.redbed{background:#fff0f0;border-color:#ffb3b3}
.bed.occ{border-style:solid;box-shadow:0 0 0 2px #cfe9ff}
.bedtag{font-size:11px;font-weight:900;color:#6b4e00;white-space:nowrap}
.bedscene{position:relative;height:40px;margin:3px 0;border-radius:10px;background:linear-gradient(#e9f7ff,#cfeaff);overflow:hidden}
.bed.redbed .bedscene{background:linear-gradient(#fff3f3,#ffdede)}
.pillow{position:absolute;left:8px;top:6px;width:26px;height:12px;background:#fff;border-radius:8px;box-shadow:0 1px 2px #0002;animation:breathe 3s ease-in-out infinite}

/* 活潑風格（首頁與病人模式） */

.btn-main:active{transform:translateY(3px);box-shadow:0 2px 0 #c93d6a}
.btn-a{background:#ffe066!important;color:#3b2f00!important;font-weight:800;box-shadow:0 5px 0 #d4ac1b!important;border:0!important}

.btn-a{animation-delay:.1s}.btn-b{animation-delay:.2s}.btn-c{animation-delay:.3s}

.zone.wide{grid-column:1/-1}

<body>
<button id="mute" class="mute" data-act="sound">🔊</button>
<div id="app"></div>

<script>
/* ================= 設定 ================= */
const DEPTS = ['Medicina', 'Pediatría', 'Odontología'];
const PERIODS = ['mañana', 'tarde'];
const AGES = ['niño', 'adulto', 'adulto mayor'];
const VISITS = ['primera vez', 'control'];
const NAMES = ['Juan Pérez','María González','Carlos Muñoz','Javiera Soto','Diego Rojas','Camila Fuentes','Felipe Araya','Valentina Silva','Rodrigo Tapia','Francisca Vega','Matías Contreras','Catalina Lagos','Nicolás Bravo','Constanza Núñez','Sebastián Reyes','Daniela Ortiz','Ignacio Díaz','Paula Espinoza','Andrés Morales','Carolina Herrera'];
const PALETTE = ['#f0a04b','#4b9ce2','#e07a9b','#7bc47f','#9b8ee0','#e8c547'];
const HAIRS = ['#3a2a20','#1f1f1f','#8a5a2b','#c0392b','#6d4c41'];
const LINES = [
  'Ayer ya quería venir.', 'Venir con un niño al consultorio es agotador.', 'Sólo vine a buscar un remedio.',
  'Por favor, rápido, tengo que volver al trabajo.', 'Me da un poco de miedo ir al dentista…', 'El doctor dijo que debo volver para un control.',
  'Llevo esperando mucho rato.', 'Ahora tengo que ir a buscar a mi hijo.', 'Quisiera cambiar la hora.'
];
const THANKS = ['¡Muchas gracias!', '¡Qué bien!', 'Gracias por todo～', '¡Gracias!'];
const OKAY = ['Bueno…', 'Entonces vuelvo otro día.', 'Entendido.'];
const RULE_NAME = {dept:'especialidad', period:'horario', age:'tramo de edad', visit:'tipo de atención'};
const PHASE_NAME = {tutorial:'Tutorial', counter:'Recepción', remind:'Recordatorios', reveal:'Resultados', dayend:'Fin del día', upgrade:'Mejora'};

// pool：可出現的條件；size：同時要符合幾條；switchMs：多久換一組；jump：插隊機率
// noshow：今天的爽約規則（符合的病人容易爽約）；emergency：急診機率
// 第一天三段：0–20 秒 / 20–45 秒 / 45–70 秒，條件逐步增加；病人出現間隔 4 → 4.5 → 5.5 秒
const DAY1_STAGES = [
  {keys: ['dept'], spawnMs: 3000, end: 20000, newKey: null, banner: ''},
  {keys: ['dept', 'period'], spawnMs: 3400, end: 45000, newKey: 'period', banner: '🆕 Nueva condición: horario (la ficha del paciente y la atención también muestran el horario)'},
  {keys: ['dept', 'period', 'age'], spawnMs: 4200, end: 70000, newKey: 'age', banner: '🆕 Nueva condición: tramo de edad (deben cumplirse las tres condiciones, toma un poco más de tiempo)'}
];
const DAY_CFG = [
  {pool:['dept','period','age'], size:3, stages:true, jump:0.15, counterMs:70000, spawnMs:4000, ramp:false, credits:4, risk:0.30, emergency:0,
   event:'Día 1: tres etapas; en cada una aparece una condición más, junto con el paciente.'},
  {pool:['dept','age'], size:2, switchMs:9000, jump:0, choose:true, risk:0.2, pair:true, phased:true, closure:false, counterMs:100000, spawnMs:4000, ramp:true, credits:3, emergency:0.12,
   event:'Día 2: primero decida a quién llamar; cuando Medicina suspende atención, arrastre a esos pacientes a « Medicina → Avisar y reagendar ».'},
  {appt:true, pool:[], size:0, switchMs:0, jump:0, counterMs:180000, spawnMs:4000, credits:0, risk:0, emergency:0,
   event:'Día 3: un día de mucho trabajo en el CESFAM. Responda las respuestas de los pacientes, asigna horas libres y envía los recordatorios al final.'},
  {mass:true, pool:['dept','period','age','visit'], size:3, switchMs:7000, jump:0, counterMs:60000, spawnMs:4000, ramp:true, credits:0, risk:0, emergency:0,
   event:'Bonus: desafío de accidente masivo. A mitad de la jornada llega una ambulancia con un grupo de pacientes heridos. Clasifícalos con el método START en 🔴 Inmediato, 🟡 Diferido y 🟢 Leve, y llévalos a la zona de atención correspondiente.'}
];
const DAYS = ['lunes','martes','miércoles'];
function dayTag() { return G.day === 3 ? 'Bonus: accidente masivo' : `Día ${G.day + 1} ${DAYS[G.day]}`; }
const RULE_SWITCH_MS = 5000;
const PATIENCE_MS = 10000;
const CHOICE_MS = 15000;   // Cuando dos pacientes llegan a recepción al mismo tiempo, tiempo para elegir
const MAX_QUEUE = 4;
const REMIND_MS = 45000;
const REVEAL_MS = 7000;
const REVEAL_STEP_MS = 700;   // Intervalo entre cada resultado al revelarse uno por uno
// 第二天分段（100 秒版）：兩人選擇 0–17 秒；急診 18–29 秒；內科停診 29–42 秒；大亂斗 42 秒起
// 第二天時間表（你的規劃）：0–20 秒兩人選擇 → 20–35 急診 → 35–50 內科停診 → 50 秒起大亂斗（三種混在一起）
const DAY2_PAIR_AT = [2000, 7000, 13000, 45000, 56000, 67000, 78000, 88000];
const DAY2_EMG_AT = [18000, 24000];
const DAY2_MIX_AT = 42000;
// 大亂斗中內科「通知改期」突然開放的時段（每段 10 秒，窗口外內科病人照一般條件）
const DAY2_WIN = [[51000, 61000], [80000, 90000]];
const DAY2_STOP_AT = 29000;
const DAY2_NOTE = {2: '🚑 Llegó un paciente de urgencia: ¡arrástrelo a « Avisar al equipo de salud para evaluación »!', 3: '🚫 Tarea sorpresiva: Medicina general suspende atención en la mañana. ¡Hay pacientes que atender!', 4: '🔀 ¡Todo mezclado! Elección de dos pacientes, urgencias y suspensión de Medicina ocurren al mismo tiempo.'};
const COMPLAINT_MS = 2500;
const MAX_STARS = 5;
const REMIND_OPTS = [
  {key:'none', label:'No enviar', cost:0, factor:1},
  {key:'night', label:'La noche anterior', cost:1, factor:0.6},
  {key:'morning', label:'La mañana del mismo día', cost:2, factor:0.35}
];
// 失約情境（虛構的預約管理情境，只影響遊戲中的模擬機率）
const APPT_REASONS = [
  {label: 'Fácil de olvidar la hora', add: 0.15},
  {label: 'Tiempo de espera largo para la hora', add: 0.12},
  {label: 'Datos de contacto posiblemente desactualizados', add: 0.15},
  {label: 'Horario de trabajo en conflicto con la hora', add: 0.12},
  {label: 'Asistencia aún sin confirmar', add: 0.1}
];
// 每天結束後可以選的升級（隨機抽三個）
const UPGRADES = [
  {name:'Un recepcionista más', desc:'La atención a los usuarios se hace 20% más rápida', apply(){ G.spawnFactor *= 1.25; }},
  {name:'+1 recordatorio', desc:'Cada día siguiente tendrás un poco más de recordatorios', apply(){ G.creditBonus += 1; }},
  {name:'Llamado rápido', desc:'Los pacientes están dispuestos a esperar 2 segundos más', apply(){ G.patienceBonus += 2000; }},
  {name:'Recuperar calificación', desc:'La calificación del CESFAM sube +2 estrellas de inmediato', apply(){ heal(40); }},
  {name:'Seguro de racha', desc:'El próximo error no corta la racha', apply(){ G.comboShield += 1; }}
];

/* ================= 共用工具 ================= */
const $ = (s) => document.querySelector(s);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(x => x[1]);
const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const pct = (x) => Math.round(x * 100) + '%';
const stars = (n) => '★'.repeat(n) + '☆'.repeat(MAX_STARS - n);
// 評價：內部是 0–100 的數值，每 20 點換算一顆星。錯誤只扣一小部分，逾時才明顯下降
function hurt(n) {
  const before = G.stars;
  G.rep = Math.max(0, (G.rep ?? 100) - n); syncStars();
  if (G.stars < before) { sfx('bad'); apptBurst('⭐ La calificación baja una estrella'); }
}
function heal(n) { G.rep = Math.min(100, (G.rep ?? 100) + n); syncStars(); }
function syncStars() { G.stars = Math.max(0, Math.min(MAX_STARS, Math.ceil((G.rep ?? 100) / 20))); }
function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
}

function avatarLegacy(p, mood = 'neutral', cls = '') {
  const mouth = {
    happy: 'M24 33 Q30 40 36 33', sad: 'M24 38 Q30 32 36 38',
    worried: 'M25 37 Q30 34 35 37', neutral: 'M25 35 L35 35'
  }[mood] || 'M25 35 L35 35';
  const brow = (mood === 'worried' || mood === 'sad')
    ? '<path d="M21 22 L26 24 M39 22 L34 24" stroke="#2b2b2b" stroke-width="1.6" stroke-linecap="round"/>' : '';
  const c = p.color || '#999';
  return `<svg class="av ${cls}" viewBox="0 0 60 90" width="60" height="90">
    <rect class="swing-l" x="10" y="46" width="8" height="22" rx="4" fill="${c}"/>
    <rect class="swing-r" x="42" y="46" width="8" height="22" rx="4" fill="${c}"/>
    <rect x="18" y="44" width="24" height="30" rx="10" fill="${c}"/>
    <rect x="20" y="72" width="8" height="16" rx="3" fill="#44505c"/>
    <rect x="32" y="72" width="8" height="16" rx="3" fill="#44505c"/>
    <circle cx="30" cy="28" r="16" fill="#f5d0b0"/>
    <path d="M14 26 Q30 2 46 26 Q40 14 30 14 Q20 14 14 26Z" fill="${p.hair || '#3a2a20'}"/>
    <circle cx="24" cy="27" r="2.2" fill="#2b2b2b"/>
    <circle cx="36" cy="27" r="2.2" fill="#2b2b2b"/>
    ${brow}
    <path d="${mouth}" stroke="#2b2b2b" stroke-width="2" fill="none" stroke-linecap="round"/>
  </svg>`;
}

/* ================= 角色（v9：年齡、髮型、配件、表情） ================= */
const STAFF = {role:'staff', color:'#1f8a70', hair:'#3a2a20', hairStyle:'bun', age:'adulto', visit:'control'};
function avatar(p, mood = 'neutral', cls = '') {
  const isStaff = p.role === 'staff';
  const child = !isStaff && p.age === 'niño';
  const elder = !isStaff && p.age === 'adulto mayor';
  const skin = '#f5d0b0', ink = '#2b2b2b', c = p.color || '#999';
  const hair = elder ? '#d9d9d9' : (p.hair || '#3a2a20');
  const style = p.hairStyle || 'short';
  const cx = 40, hr = child ? 19 : 16.5, cy = child ? 38 : 32;
  const bodyTop = child ? 58 : 50, bodyH = child ? 26 : 32, bodyW = child ? 24 : 28;
  const bw = bodyW / 2, legTop = bodyTop + bodyH - 2, legH = child ? 16 : 22;
  const armY = bodyTop + 4, armH = bodyH - 8;
  const ex = 6, ey = cy + 1;
  const handL = [cx - bw - 1.5, armY + armH + 2], handR = [cx + bw + 1.5, armY + armH + 2];
  const stroke = (d, w = 2) => `<path d="${d}" stroke="${ink}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
  const dots = (r) => `<circle cx="${cx - ex}" cy="${ey}" r="${r}" fill="${ink}"/><circle cx="${cx + ex}" cy="${ey}" r="${r}" fill="${ink}"/>`;

  // 腿
  const legs = `<rect x="${cx - bw + 4}" y="${legTop}" width="7" height="${legH}" rx="3.5" fill="#44505c"/>
    <rect x="${cx + bw - 11}" y="${legTop}" width="7" height="${legH}" rx="3.5" fill="#44505c"/>
    <ellipse cx="${cx - bw + 7.5}" cy="${legTop + legH}" rx="5" ry="2.6" fill="${ink}"/>
    <ellipse cx="${cx + bw - 7.5}" cy="${legTop + legH}" rx="5" ry="2.6" fill="${ink}"/>`;

  // 身體（櫃台人員穿白袍）
  const torso = isStaff
    ? `<rect x="${cx - bw}" y="${bodyTop}" width="${bodyW}" height="${bodyH}" rx="10" fill="#fff" stroke="${c}" stroke-width="2"/>
       <rect x="${cx - 2.5}" y="${bodyTop + 2}" width="5" height="${bodyH - 4}" fill="${c}" opacity=".3"/>
       <rect x="${cx + 2}" y="${bodyTop + 7}" width="9" height="6" rx="1.5" fill="${c}"/>`
    : `<rect x="${cx - bw}" y="${bodyTop}" width="${bodyW}" height="${bodyH}" rx="10" fill="${c}"/>
       <path d="M${cx - 5} ${bodyTop} L${cx} ${bodyTop + 7} L${cx + 5} ${bodyTop}" fill="#fff" opacity=".85"/>`;

  // 手臂與手
  const armFill = isStaff ? '#fff' : c;
  const armStroke = isStaff ? `stroke="${c}" stroke-width="1.5"` : '';
  const arms = `<rect x="${cx - bw - 5}" y="${armY}" width="7" height="${armH}" rx="3.5" fill="${armFill}" ${armStroke}/>
    <rect x="${cx + bw - 2}" y="${armY}" width="7" height="${armH}" rx="3.5" fill="${armFill}" ${armStroke}/>
    <circle cx="${handL[0]}" cy="${handL[1]}" r="3.5" fill="${skin}"/>
    <circle cx="${handR[0]}" cy="${handR[1]}" r="3.5" fill="${skin}"/>`;

  // 配件：小孩拿棒棒糖、長者拿拐杖、初診病人拿病歷夾
  let acc = '';
  if (child) {
    acc = `<line x1="${handR[0]}" y1="${handR[1]}" x2="${handR[0] + 4}" y2="${handR[1] - 16}" stroke="#8a5a2b" stroke-width="1.8"/>
      <circle cx="${handR[0] + 4}" cy="${handR[1] - 19}" r="5" fill="#ff6f91" stroke="#fff" stroke-width="1.5"/>`;
  } else if (elder) {
    acc = `<line x1="${handR[0]}" y1="${handR[1]}" x2="${handR[0]}" y2="${legTop + legH}" stroke="#8a5a2b" stroke-width="2.4" stroke-linecap="round"/>`;
  } else if (!isStaff && p.visit === 'primera vez' && cfg().mass) {
    acc = `<rect x="${cx - bw - 14}" y="${armY + 7}" width="12" height="15" rx="2" fill="#fff" stroke="#8a7f6b" stroke-width="1.4"/>
      <line x1="${cx - bw - 11}" y1="${armY + 12}" x2="${cx - bw - 5}" y2="${armY + 12}" stroke="#b9b09b" stroke-width="1.2"/>
      <line x1="${cx - bw - 11}" y1="${armY + 16}" x2="${cx - bw - 5}" y2="${armY + 16}" stroke="#b9b09b" stroke-width="1.2"/>`;
  }

  // 後面的頭髮
  let hairBack = '';
  if (style === 'long') hairBack = `<rect x="${cx - hr - 3}" y="${cy - 4}" width="${2 * hr + 6}" height="24" rx="9" fill="${hair}"/>`;
  else if (style === 'bun') hairBack = `<ellipse cx="${cx}" cy="${cy - 3}" rx="${hr + 1}" ry="${hr}" fill="${hair}"/><circle cx="${cx}" cy="${cy - hr - 3}" r="6.5" fill="${hair}"/>`;
  else if (style === 'curly') hairBack = [[-14, -9], [0, -17], [14, -9], [-16, 3], [16, 3]].map(([dx, dy]) => `<circle cx="${cx + dx}" cy="${cy + dy}" r="7" fill="${hair}"/>`).join('');
  else hairBack = `<ellipse cx="${cx}" cy="${cy - 3}" rx="${hr + 1}" ry="${hr}" fill="${hair}"/>`;

  // 瀏海（蓋在臉上方）
  const fringe = style === 'curly' ? '' :
    `<path d="M${cx - hr} ${cy - 2} Q${cx - hr + 3} ${cy - hr - 2} ${cx} ${cy - hr + 3} Q${cx + hr - 3} ${cy - hr - 2} ${cx + hr} ${cy - 2} Q${cx + hr - 7} ${cy - hr + 7} ${cx} ${cy - hr + 7} Q${cx - hr + 7} ${cy - hr + 7} ${cx - hr} ${cy - 2}Z" fill="${hair}"/>`;

  const ears = `<circle cx="${cx - hr}" cy="${cy + 2}" r="3" fill="${skin}"/><circle cx="${cx + hr}" cy="${cy + 2}" r="3" fill="${skin}"/>`;
  const face = `<circle cx="${cx}" cy="${cy}" r="${hr}" fill="${skin}"/>`;

  // 表情
  let eyes = dots(2.1), brows = '', mouth = '', extra = '', blush = '';
  switch (mood) {
    case 'happy':
      eyes = stroke(`M${cx - ex - 2.5} ${ey} q2.5 -3 5 0 M${cx + ex - 2.5} ${ey} q2.5 -3 5 0`);
      mouth = `<path d="M${cx - 5} ${cy + 7} Q${cx} ${cy + 14} ${cx + 5} ${cy + 7} Z" fill="#c0504d" stroke="${ink}" stroke-width="1.5" stroke-linejoin="round"/>`;
      blush = `<circle cx="${cx - 10}" cy="${cy + 5}" r="3" fill="#ff8fa3" opacity=".5"/><circle cx="${cx + 10}" cy="${cy + 5}" r="3" fill="#ff8fa3" opacity=".5"/>`;
      break;
    case 'worried':
      brows = stroke(`M${cx - ex - 3} ${ey - 4} L${cx - ex + 3} ${ey - 6} M${cx + ex + 3} ${ey - 4} L${cx + ex - 3} ${ey - 6}`, 1.8);
      mouth = stroke(`M${cx - 5} ${cy + 9} q2.5 -2.5 5 0 t5 0`, 1.8);
      extra = `<path d="M${cx + hr - 1} ${cy - 6} q3 5 0 7 q-3 -2 0 -7z" fill="#8fd3ff"/>`;
      break;
    case 'sad':
      brows = stroke(`M${cx - ex - 3} ${ey - 4} L${cx - ex + 3} ${ey - 6} M${cx + ex + 3} ${ey - 4} L${cx + ex - 3} ${ey - 6}`, 1.8);
      mouth = stroke(`M${cx - 5} ${cy + 11} Q${cx} ${cy + 7} ${cx + 5} ${cy + 11}`, 1.8);
      extra = `<path d="M${cx - ex} ${ey + 3} q-2 4 0 5 q2 -1 0 -5z" fill="#8fd3ff"/>`;
      break;
    case 'angry':
      brows = stroke(`M${cx - ex - 3} ${ey - 6} L${cx - ex + 3} ${ey - 3} M${cx + ex + 3} ${ey - 6} L${cx + ex - 3} ${ey - 3}`, 2.2);
      eyes = dots(1.8);
      mouth = stroke(`M${cx - 5} ${cy + 11} Q${cx} ${cy + 7} ${cx + 5} ${cy + 11}`, 2);
      extra = `<path d="M${cx + hr - 3} ${cy - hr + 6} l3 -3 M${cx + hr} ${cy - hr + 10} l3 -1 M${cx + hr - 4} ${cy - hr + 2} l1 -4" stroke="#d9534f" stroke-width="1.8" stroke-linecap="round"/>`;
      break;
    case 'impatient':
      eyes = stroke(`M${cx - ex - 2.5} ${ey} h5 M${cx + ex - 2.5} ${ey} h5`, 2.2);
      brows = stroke(`M${cx - ex - 3} ${ey - 5} h6 M${cx + ex - 3} ${ey - 5} h6`, 1.8);
      mouth = stroke(`M${cx - 4} ${cy + 9} l8 -1`, 2);
      extra = `<text x="${cx + hr - 3}" y="${cy - hr + 2}" font-size="9" font-weight="700" fill="#6b7d79">…</text>`;
      break;
    default:
      mouth = stroke(`M${cx - 4} ${cy + 9} h8`, 2);
  }

  // 眼鏡（長者與櫃台人員）
  const glasses = (elder || isStaff)

let AC = null;
let soundOn = (() => { try { return localStorage.getItem('clinic-sound') !== 'off'; } catch (e) { return true; } })();
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, dur = 0.12, type = 'triangle', vol = 0.14, when = 0) {
  if (!soundOn) return;
  const ac = audio(); if (!ac) return;
  const t0 = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(ac.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const SFX = {
  ok() { tone(784, 0.16, 'sine', 0.09); tone(1046, 0.2, 'sine', 0.07, 0.07); },
  bad() { tone(220, 0.2, 'sawtooth', 0.08); tone(165, 0.25, 'sawtooth', 0.08, 0.12); },
  combo(n) {
    const base = 392 * Math.pow(2, (Math.min(n, 16) % 12) / 12);
    [0, 4, 7, 12, 16].forEach((s, i) => tone(base * Math.pow(2, s / 12), 0.18, 'square', 0.06, i * 0.06));
  },
  star() { tone(988, 0.12); tone(1319, 0.2, 'triangle', 0.14, 0.1); },
  leave() { tone(330, 0.15, 'triangle', 0.1); tone(262, 0.25, 'triangle', 0.1, 0.12); },
  reveal() { tone(523, 0.1); },
  upgrade() { [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'triangle', 0.12, i * 0.08)); },
  win() { [523, 659, 784, 1046, 784, 1046].forEach((f, i) => tone(f, 0.2, 'triangle', 0.14, i * 0.1)); },
  lose() { [392, 330, 262, 196].forEach((f, i) => tone(f, 0.25, 'triangle', 0.12, i * 0.15)); }
};
function sfx(name, ...a) { try { SFX[name](...a); } catch (e) {} }
function toggleSound() {
  soundOn = !soundOn;

/* 產生一位病人；一半機率符合目前的規則 */
const FIT_RATE = 0.5;   // Probabilidad de que cada paciente cumpla las reglas actuales
function newPatient() {
  const p = {
    id: uid(), name: pick(NAMES), line: pick(LINES),
    dept: pick(DEPTS), period: pick(PERIODS), age: pick(AGES), visit: pick(VISITS),
    risk: 0, history: Math.random() < 0.4, color: pick(PALETTE), hair: pick(HAIRS),
    patience: G.maxPatience, remind: 'none', arrived: null
  };
  // 急診：不用預約，要立刻安排看診
  // 緊急程度 1–3；第三天耐心有差，選下一位時才有取捨
  p.urgency = pick([1, 2, 3]);
  if (cfg().choose) p.patience = Math.round(G.maxPatience * (0.5 + Math.random() * 0.5));
  G.seenCount = (G.seenCount || 0) + 1;
  if (G.day === 0 && G.seenCount <= 3) p.patience = Math.round(p.patience * 1.3);
  if (Math.random() < (cfg().emergency || 0)) { p.emergency = true; p.patience = 4000; p.urgency = 3; }
  p.mask = G.day === 2 && Math.random() < 0.5;
  p.patience = Math.round(p.patience * (G.patFactor || 1));   // Con más gente, los pacientes tienen menos paciencia
  G.stats.total++;
  return p;
}

// 病人走到櫃台時，才依「當下」的規則決定符合與否，避免排隊時規則已經換掉
function applyFit(p) {
  const fit = Math.random() < FIT_RATE;
  if (G.mode === 'or') {
    // 或：符合時只有一條對，其餘都不對；不符合時全部都不對
    const ok = fit ? pick(G.rules) : null;
    for (const r of G.rules) p[r] = r === ok ? G.open[r] : pick(others(rangeOf(r), G.open[r]));
  } else {
    for (const r of G.rules) p[r] = G.open[r];
    // 且：不符合時只讓其中一條不對，比較公平
    if (!fit) { const bad = pick(G.rules); p[bad] = pick(others(rangeOf(bad), G.open[bad])); }
  }
  // 停診後，內科病人會比較多
  if (G.closed && Math.random() < 0.3) p.dept = G.closed;
  // 內科停診病人一定保留內科（否則條件會把他的科別改掉，變成其他科）
  if (p.stopAff) p.dept = 'Medicina';
  // 沒來機率：有爽約規則的關卡，符合規則的人高很多（看得到原因，不是純隨機）
  if (cfg().noshow) {
    p.ruleHit = noshowHit(p);
    p.risk = clamp((p.ruleHit ? 0.65 : 0.12) + (Math.random() * 0.06 - 0.03), 0.05, 0.85);
  } else {
    // 失約風險來自預約情境（虛構，不代表真實 CESFAM 病人風險）
    p.reason = Math.random() < 0.35 ? pick(APPT_REASONS) : null;
    p.risk = clamp(cfg().risk + (p.history ? 0.12 : 0) + (p.reason ? p.reason.add : 0) + (Math.random() * 0.04 - 0.02), 0.05, 0.85);
  }
  if (p.emergency) p.risk = 0;
  p.hairStyle = p.age === 'adulto mayor' ? 'grey' : p.age === 'niño' ? pick(['curly', 'bun', 'short']) : pick(['short', 'long', 'bun']);
}

// 每位新病人走到櫃台：換一組新規則，再依新規則決定這位病人的條件（一條規則對應一位病人）
function onNewFront() {
  G.ruleAcc = 0;
  rotateRule();
  if (G.front) applyFit(G.front);
}
function spawn() {
  const p = newPatient();
  if (!G.front && !G.choice) { G.front = p; onNewFront(); } else G.queue.push(p);
}
// 兩人同時到：記為同一組，之後只會出現一次「先看誰」的選擇
function spawnPair() {
  const g = uid();
  const a = newPatient(), b = newPatient();
  a.group = b.group = g;
  if (!G.front && !G.choice && !G.jumper) {
    G.choice = [a, b]; G.choiceLeft = CHOICE_MS;
    G.choice.forEach(c => { c.patience = Math.round(c.patience * CHOICE_MS / G.maxPatience); });
  } else G.queue.push(a, b);
}

// 第二天急診：固定時間出現；櫃台忙時排到最前面
function spawnScheduledEmergency() {
  const p = newPatient();
  p.emergency = true; p.patience = 4000; p.urgency = 3;
  if (!G.front && !G.choice && !G.jumper) { G.front = p; onNewFront(); } else G.queue.unshift(p);
}
// 第二天固定雙人排序：到了指定時間且櫃台空著時出現
function spawnScheduledPair() {
  const g = uid(); const a = newPatient(), b = newPatient();
  a.group = b.group = g;
  // 兩種情形：一般是「急的先看」；另一種是「同樣緊急，等比較久的先看」
  if (Math.random() < 0.5) {
    b.urgency = a.urgency;
    const longer = Math.random() < 0.5 ? a : b;
    longer.patience = Math.round(longer.patience * 0.55);
  }
  if (!G.front && !G.choice && !G.jumper) {
    G.choice = [a, b]; G.choiceLeft = CHOICE_MS;
    G.choice.forEach(c => { c.patience = Math.round(c.patience * CHOICE_MS / G.maxPatience); });
  } else G.queue.unshift(a, b);   // Recepción ocupada: se ponen al frente y al llamar siempre aparece la elección de dos
}
// 第二天臨時停診任務：4 位病人（3 位內科受影響、1 位不受影響），混在一般佇列裡一位一位來
function startStop() {
  const used = new Set([G.front && G.front.name, ...(G.choice || []).map(c => c.name), ...G.queue.map(q => q.name)].filter(Boolean));
  const mk = (dept, aff) => {
    let p; do { p = newPatient(); } while (used.has(p.name));
    used.add(p.name); p.dept = dept; p.stopAff = aff; p.fromStop = true; return p;
  };
  const cards = [mk('Medicina', true), mk('Medicina', true), mk('Medicina', true), mk(pick(['Pediatría', 'Odontología']), false)];
  G.stop = {cards, notified: 0, need: 3};
  G.evt = null;
  G.queue.unshift(...shuffle(cards));
  if (!G.front && !G.choice && G.queue.length) { G.front = G.queue.shift(); onNewFront(); }
  G.note = DAY2_NOTE[3] + eduTip('d2a');
}
// 同事請假期間：不符合的病人先請稍候（耐心暫停），請假結束後排回佇列
function holdFront(p) {
  G.heldQ = G.heldQ || [];
  G.heldQ.push(p);
  G.note = `${p.name} pide que espere; cuando vuelva la atención, lo atendemos`;
  advanceFront(); render();
}
function releaseHeld() {
  if (!G.heldQ || !G.heldQ.length) return;
  G.queue.unshift(...G.heldQ); G.heldQ = [];
  if (!G.front && !G.choice) advanceFront();
}
// 停診期間：只要是內科病人（不論是不是停診名單）都要拖到「內科 → 通知改期」
function stopOpen() {
  if (!(G.stop && cfg().phased)) return false;
  if (G.dayPhase === 3) return true;   // 35–50 segundos: suspensión total de Medicina
  // 大亂斗：只有窗口開放期間，或窗口關閉時正好在櫃台的那位內科病人
  return G.dayPhase >= 4 && !!(G.winOpen || (G.winLinger && G.winLinger === G.front));
}
function stopNormalFront(p, zone) {
  if (zone !== 'Medicina') { stopWrong(`${p.name} es paciente de Medicina; durante la suspensión arrástrelo a « Medicina → Avisar y reagendar »`); return render(); }
  G.score += 5; G.stats.correct++; G.combo++; heal(1); sfx('ok');
  G.stats.resched = (G.stats.resched || 0) + 1;
  G.rescheduleQ = G.rescheduleQ || []; G.rescheduleQ.push({name: p.name, dept: p.dept});

  G.note = `${p.name}: Medicina suspendida, reagendamiento avisado +5`;

}
// 急診：先拖到「通知醫護人員評估」（通知後病人留在櫃台），再拖到任一科別安排看診
function emergencyWrong(msg) {
  G.score -= 5; G.stats.wrong++; G.combo = 0; hurt(8); sfx('bad');
  stamp('Error ✗', false); G.scoreWhy = 'Error en urgencia'; G.note = msg; render();
}
function emergencyFront(p, zone) {
  if (!p.notified) {
    if (zone !== 'notify') return emergencyWrong(`${p.name} es urgencia; primero arrástrelo a « Avisar al equipo de salud para evaluación »`);

  G.score += 10; G.stats.correct++; G.combo++; heal(1); sfx('ok');

  G.scoreWhy = 'Atención agendada tras el aviso';
  G.note = `🚑 ${p.name}: atención agendada en ${zone} +10`;

}
function stopWrong(msg) {

}
// 停診病人來到櫃台時：內科病人拖到「內科 → 通知改期」；其他病人照原本的科別安排看診
function stopFront(p, zone) {
  const S = G.stop;
  if (p.stopAff) {
    if (zone !== 'Medicina') { stopWrong(`${p.name} tiene atención suspendida; arrástrelo a « Medicina → Avisar y reagendar » (avisar y reagendar)`); return render(); }
    S.notified++;
    G.score += 8; G.stats.correct++; G.combo++; heal(1); sfx('ok');
    G.stats.resched = (G.stats.resched || 0) + 1;
    G.rescheduleQ = G.rescheduleQ || []; G.rescheduleQ.push({name: p.name, dept: p.dept});
    stamp('Avisado ✓', true); G.scoreWhy = 'Aviso por suspensión de Medicina';
    G.note = `Avisado ${p.name} +8 (${Math.min(S.notified, S.need)}／${S.need})`;
    if (S.notified === S.need) { G.score += 15; G.note = '🎉 ¡Suspensión de Medicina resuelta! +15 puntos extra'; sfx('win'); confetti(30); }
  } else {
    const pass = matchesAll(p);   // Los pacientes no afectados se evalúan con las condiciones normales
    const want = pass ? p.dept : 'door';
    if (zone !== want) { stopWrong(pass ? `${p.name} cumple las condiciones; arrástrelo a ${p.dept}` : `${p.name} no cumple las condiciones; arrástrelo a la salida`); return render(); }
    G.score += 5; G.stats.correct++; G.combo++; heal(1); sfx('ok');
    G.booked.push(p);
    stamp('Se mantiene la hora ✓', true); G.scoreWhy = 'Se mantuvo la hora';
    G.note = `${p.name} mantiene su hora +5`;
  }
  advanceFront(); render();
}
// 第二天突發小事件（每天最多一次）：電腦當機 4 秒；同事請假 12 秒，門口暫停

/* 插隊：有人說很急，玩家決定讓不讓他先進 */
function makeJumper() {
  // 插隊時櫃台時間 +5 秒，並給 6 秒決定
  // 插隊者是否真的很急，玩家要從他說的話判斷：急的人要先看，不急的人請他排隊
  G.jumper = newPatient(); G.jumperLeft = 6000;
  G.jumper.jumpUrgent = Math.random() < 0.5;
  G.jumper.line = G.jumper.jumpUrgent ? 'Me duele mucho el pecho, ¡es urgente!' : 'Voy atrasado al trabajo, ¿me puede atender primero?';
  G.note = '🙋 Alguien quiere pasar delante; escuche lo que dice y decida.';
}
// 插隊判斷：急的人讓他先進 +5；不急卻插隊 −3、排隊的人會抱怨
function jumperJudge(ok, pts, title, body) {
  if (ok) { G.score += pts; G.stats.correct++; G.combo++; heal(1); sfx('ok'); }
  else { G.score -= Math.abs(pts); G.stats.wrong++; G.combo = 0; hurt(8); sfx('bad'); }
  G.note = (ok ? '✓ ' : '✗ ') + title + '：' + body;
  G.scoreWhy = title;
}
function acceptJumper() {
  const j = G.jumper; if (!j) return;
  G.jumper = null;
  if (j.jumpUrgent) jumperJudge(true, 5, 'Dejar pasar al urgente', 'Era realmente urgente, hiciste bien.');
  else { jumperJudge(false, -3, 'No era urgente', 'Dejar pasar a quien no es urgente hace esperar más a los demás.'); setComplaint('¿Por qué dejó pasar a alguien que no es urgente? ¡Llevamos mucho rato esperando!'); }
  if (G.front) G.queue.unshift(G.front);
  G.front = j; j.patience = G.maxPatience; onNewFront();
  // 排隊的人會因為被插隊而少一點耐心
  G.queue.forEach(q => { q.patience = Math.max(1500, q.patience - 2000); });
  G.stats.jumped = (G.stats.jumped || 0) + 1;
  render();
}
function declineJumper() {
  if (!G.jumper) return;
  const j = G.jumper;
  G.queue.push(j); G.jumper = null;
  if (j.jumpUrgent) { jumperJudge(false, -5, 'Era urgente', 'Era realmente urgente; pedirle que esperara fue un error.'); setComplaint('¡Era urgente y me hizo esperar!'); }
  else jumperJudge(true, 3, 'Pedir que espere al que no es urgente', 'Bien decidido, los demás no tienen que esperar más.');
  render();
}

// 每次一定換成不一樣的規則（不會剛好抽到跟上一位相同的）
function rotateRule() {
  const c = cfg();
  const pool = G.poolNow || c.pool;
  const size = Math.min(c.size, pool.length);   // Número de condiciones fijo (día 1 y 2: dos condiciones)
  // 沒有規則池的天（例如第三天 CESFAM 忙碌的一天）直接略過，避免無限迴圈
  if (!pool || !pool.length) { G.rules = []; G.open = {}; G.mode = 'and'; return; }
  const prev = G.mode + '|' + G.rules.map(r => r + G.open[r]).join('|');
  let key, tries = 0;
  do {
    const picked = shuffle(pool).slice(0, size);
    G.rules = pool.filter(x => picked.includes(x));
    G.mode = 'and';
    for (const r of G.rules) G.open[r] = pick(rangeOf(r));
    key = G.mode + '|' + G.rules.map(r => r + G.open[r]).join('|');
  } while (key === prev && ++tries < 50);
}

function startDay(d) {

  G.paused = false; G.quitArmed = false; G.tutPage = 0; G.okStreak = 0; G.badStreak = 0; G.restUntil = 0; G.seenCount = 0; G.practiceDone = false; G.practiceMsg = null; G.rampFactor = 1; G.rampStage = 0; G.patFactor = 1;
  G.rules = []; G.open = {}; G.ruleAcc = 0; G.spawnAcc = 0;
  G.dayPhase = 1; G.pairIdx = 0; G.emgIdx = 0; G.stop = null; G.winOpen = false; G.winLinger = null;
  // 有 addAt 的關卡一開始只用前兩個條件（科別、時段），到時間再加入年齡層
  G.poolNow = null; G.ageNoted = false;

  G.queue = []; G.front = null; G.jumper = null; G.jumperLeft = 0;
  G.booked = []; G.credits = cfg().credits + G.creditBonus;
  G.maxPatience = PATIENCE_MS + G.patienceBonus;

  G.heldQ = []; G.choice = null; G.choiceLeft = 0; G.closed = null; G.closedDone = false; G.mode = 'and'; G.disasterDone = false; G.casualties = []; G.waitRoom = []; G.minor = []; G.lastJudge = null; G.bays = bayInit();
  G.note = d === 0 ? 'Pista: revise las condiciones de atención arriba, arrastre al paciente a la especialidad correspondiente; si no cumple, arrástrelo a la salida.' : '';
  G.complaint = null;
  render();
}

// 教學結束，正式開始櫃台倒數
function beginCounter() {
  if (G.phase !== 'tutorial') return;
  if (!cfg().appt && !cfg().mass) { G.refillAcc = 0; G.refillIn = 200; }   // Al inicio la recepción no tiene nadie: se llama al primero de inmediato
  G.phase = 'counter'; G.t = cfg().counterMs; G.totalT = G.t; G.rampFactor = 1; G.rampStage = 0; G.patFactor = 1;
  if (cfg().stages) { G.stageIdx = 0; G.poolNow = DAY1_STAGES[0].keys; G.freshKey = null; rotateRule(); }
  if (cfg().phased) { G.evtDone = true; G.evt = null; }   // El día 2 ya no tiene fallas ni permisos al azar; usa un calendario fijo
  if (cfg().appt) {
    // 第三天：先看階段說明，按「開始」後才 3-2-1
    apptInit();
  } else {
    // 先倒數 3-2-1，時間和病人都還沒開始
    G.countdown = 3; G.cdAcc = 0;
    // 第一位病人在倒數時就已經到櫃台，倒數結束馬上可以操作（不再顯示「等待下一位病人」）
    if (!cfg().appt && !cfg().mass && !G.front) spawn();
  }
  render();
}
// 倒數結束後才真正開始：發第一位病人或啟動第三天
function startPlay() {
  G.countdown = 0;

  G.note = G.note || '';

}

/* 櫃台：安排看診或請回目前這位病人 */
// zone：拖曳時放的區域（科別名或 'door'）；按鈕則不帶 zone
// 動態難度（計畫書 5.3）：連續答對 → 稍微加快；連續答錯 → 暫時放慢；上下限固定
function trackStreak(ok) {
  if (ok) {
    G.okStreak = (G.okStreak || 0) + 1; G.badStreak = 0;
    // 喘息（5.4）：連續正確 5 位，櫃台人員喊話，病人暫停 3 秒
    if (G.okStreak === 5 && cfg().ramp) {
      G.restUntil = Date.now() + 3000;
      G.staffMood = 'happy'; G.staffLine = '¡Qué bien! Todo va bien hasta ahora, tómese un vaso de agua.'; G.staffUntil = Date.now() + 3000;
      G.note = '☕ 5 respuestas correctas seguidas: la recepción descansa 3 segundos';
    }
  } else {
    G.badStreak = (G.badStreak || 0) + 1; G.okStreak = 0;
  }
}
// 病人出現速度的倍率：只在 1.0 到 1.25 之間調整
function dynSpawnFactor() {
  if ((G.badStreak || 0) >= 3) return 1.25;
  if ((G.okStreak || 0) >= 5) return 0.92;
  return 1;
}
function decida(pass, zone) {
  if (G.phase !== 'counter' || !G.front || G.countdown > 0) return;
  const p = G.front;
  if (p.fromStop && p.stopAff) return stopFront(p, zone);
  if (stopOpen() && p.dept === 'Medicina' && !p.emergency) return stopNormalFront(p, zone);
  if (p.emergency) return emergencyFront(p, zone);
  if (zone === 'hold') { if (!(G.evt && G.evt.type === 'leave')) { G.note = 'Ahora la salida funciona bien; no hace falta pedir que espere'; return render(); } return holdFront(p); }
  if (G.evt && G.evt.type === 'leave' && zone === 'door') { G.note = 'Compañero con permiso: la salida está pausada; puede pedir que espere'; return render(); }
  const match = p.emergency ? true : matchesAll(p);
  // 內科停診：內科病人要轉到其他開著的科別
  if (G.closed && p.dept === G.closed && !p.emergency) return transfer(p, zone);
  let correct;
  if (zone === undefined) correct = pass === match;
  else if (p.emergency) correct = pass;                       // Urgencia: puede ir a cualquier box de especialidad
  else correct = pass ? (match && zone === p.dept) : !match;  // Para agendar atención debe ir a su propia especialidad
  stamp(pass ? 'Atención ✓' : 'Pedir que vuelva ✗', correct);
  G.scoreWhy = (pass ? 'Agendar atención' : 'Pedir que vuelva') + (correct ? ' correcto' : ' incorrecto');
  setStaff(correct, pass);
  trackStreak(correct);

  if (correct) {
    heal(1);
    G.combo++;
    const pts = 5 + Math.min(G.combo - 1, 4) * 2;
    G.score += pts; G.stats.correct++;
    if (pass) {
      if (p.emergency) { G.stats.emergency = (G.stats.emergency || 0) + 1; G.note = `🚑 ${p.name}: urgencia atendida +${pts}`; }
      else { G.booked.push(p); G.note = `${p.name} agendado; vendrá más tarde +${pts}` + eduTip('d1a'); }
      ghostLeave(p, 'happy', 'right', pick(THANKS));
    } else {
      G.note = `${p.name} debe volver +${pts}`;
      G.note += eduTip('d1b');
      ghostLeave(p, 'neutral', 'left', pick(OKAY));
    }
    if (G.combo % 4 === 0) {
      comboBurst(G.combo);
      if (G.stars < MAX_STARS) { const b4 = G.stars; heal(10); if (G.stars > b4) { G.note += '｜La calificación del CESFAM sube una estrella'; sfx('star'); } }
    } else {
      sfx('ok');
    }
    flashQ('front', 'ok', '+' + pts);
  } else {
    if (G.comboShield > 0) { G.comboShield--; G.note = 'El seguro de racha funcionó: la racha no se cortó'; }
    else G.combo = 0;
    G.score -= 5; G.stats.wrong++;
    hurt(8);
    if (p.disaster) { G.score -= 5; hurt(8); }
    G.note = p.emergency ? `${p.name} es urgencia: no se puede pedir que vuelva −5, calificación baja`
      : match ? `${p.name} sí cumplía la regla: no debía pedirle que volviera −5, calificación baja` : `${p.name} no cumple la regla: no debía agendarlo −5, calificación baja`;
    setComplaint(p.emergency ? '¡Me muero, y usted no me deja pasar!' : match ? '¡Pero si cumplo los requisitos!' : '¿Por qué me dejó pasar? ¡No soy de esos!');
    ghostLeave(p, 'angry', 'left', match ? '¡Si cumplo!' : '¿Por qué me dejó pasar?');
    sfx('bad');
    flashQ('front', 'bad', '−5');
  }
  advanceFront();
  render();
}

/* 內科停診通知：拖到其他開著的科別＝轉診成功；拖到門口或停診的科別＝投訴 */
function transfer(p, zone) {
  // 停診流程（計畫書 3.2）：通知病人 → 記錄待重新安排，不可轉往不相關的科別
  const ok = zone === 'resched';
  stamp(ok ? 'Avisado ✓' : 'No se puede derivar ✗', ok);
  G.scoreWhy = ok ? 'Aviso y reagendamiento' : 'Paciente derivado al lugar equivocado';
  setStaff(ok, true);
  trackStreak(ok);
  if (ok) {
    const pts = 8;
    G.score += pts; G.stats.correct++; G.combo++;
    G.stats.resched = (G.stats.resched || 0) + 1;
    G.rescheduleQ = G.rescheduleQ || [];
    G.rescheduleQ.push({name: p.name, dept: p.dept});
    G.note = `Avisado ${p.name}, esperando un nuevo horario (por reagendar) +${pts}`;
    ghostLeave(p, 'happy', 'right', '¡Bien, espero el aviso!');
    sfx('ok');
    flashQ('front', 'ok', '+' + pts);
  } else {
    const door = zone === undefined || zone === 'door';
    G.score -= 5; G.stats.wrong++; G.combo = 0;
    hurt(8);
    G.note = door ? `${p.name} no puede ser enviado de vuelta. Avísale y reagenda −5, calificación baja` : `${p.name} no puede pasar a otra especialidad; usa « Avisar y reagendar » −5, calificación baja`;
    setComplaint(door ? '¿Me quiere echar? ¡Todavía necesito atención!' : '¡Yo vengo por Medicina, no por acá!');
    ghostLeave(p, 'angry', 'left', '¡Me equivocaron!');
    sfx('bad');
    flashQ('front', 'bad', '−5');
  }
  advanceFront();
  render();
}

// 櫃台空了之後等多久來下一位（人潮變多時會縮短），最短 0.8 秒
function refillDelay() {
  return Math.max(250, Math.round(spawnBase() * G.spawnFactor * G.rampFactor * 0.15));   // Si la recepción está vacía mucho tiempo, se acorta la espera
}

/* 換下一位：櫃台空了就很快叫下一位 */
function advanceFront() {
  // 選下一位：排隊有兩人以上時，讓玩家選先叫誰
  if (cfg().choose && G.queue.length >= 2 && !G.jumper && G.queue[0].group && G.queue[0].group === G.queue[1].group) {
    G.front = null; G.choice = [G.queue.shift(), G.queue.shift()]; G.choiceLeft = CHOICE_MS;
    // 耐心按比例延長，讓耐心少的人仍然較快離開
    G.choice.forEach(c => { c.patience = Math.round(c.patience * CHOICE_MS / G.maxPatience); c.group = null; });
    return;
  }
  if (G.queue.length) G.front = G.queue.shift();
  else if (G.jumper) { G.front = G.jumper; G.jumper = null; }
  else G.front = null;
  if (G.front) onNewFront();
  if (!G.front && G.phase === 'counter' && !G.choice) { G.refillAcc = 0; G.refillIn = refillDelay(); }
}

function pickNext(i, auto) {
  const c = G.choice; if (!c || !c[i] || G.countdown > 0) return;
  const chosen = c[i];
  const rest = c.filter((_, j) => j !== i);
  rest.forEach(r => { r.group = null; });   // Este grupo ya fue elegido; no vuelve a aparecer la elección
  const other = rest[0];
  const pcW = chosen.patience, poW = other ? other.patience : 0;
  G.choice = null; G.queue.unshift(...rest);
  rest.forEach(r => { r.patience = Math.max(0, r.patience - 3000); });   // Se llama primero a uno; el otro espera más
  G.front = chosen; onNewFront();
  // 選完後給足時間幫他分配科別
  chosen.patience = Math.max(chosen.patience, G.maxPatience);
  // 回饋：比較緊急程度
  const uc = chosen.urgency, uo = other ? other.urgency : 0;
  if (auto) {
    G.note = `Se acabó el tiempo para elegir; el sistema llamó a ${chosen.name} (${URG[uc].label})`;
    stamp('Sin tiempo para elegir', false);
  } else if (!other) {
    G.note = `Atendiendo primero a ${chosen.name}; asígnele la especialidad`;
    stamp('Primero ' + chosen.name, true);
  } else if (uc > uo) {
    G.score += 3;
    G.note = `${chosen.name} (${URG[uc].label}) primero, decisión correcta +3. ${other.name} espera un poco más` + eduTip('d2b');
    stamp('Decisión correcta ✓', true);
    flashQ('front', 'ok', '+3');
    sfx('ok');
  } else if (uc === uo) {
    if (pcW <= poW + 1000) {   // Esperó más (menos paciencia) → correcto
      G.score += 3; G.note = `${chosen.name} y ${other.name} eran igual de urgentes; ${chosen.name} esperó más, primero +3` + eduTip('d2b');
      stamp('Esperó más ✓', true); flashQ('front', 'ok', '+3'); sfx('ok');
    } else {
      G.score -= 3; G.note = `Igual de urgentes: debía llamar primero a ${other.name}, que esperó más −3`;
      stamp('Debía llamar al que esperó más', false); sfx('bad');
    }
  } else {
    G.note = `${other.name} (${URG[uo].label}) era más urgente, pero llamaste primero a ${chosen.name}`;
    stamp('Llamaste al menos urgente', false);
    sfx('bad');
  }
  render();
}

function timeoutFront() {
  G.stats.timeout++; G.score -= 3; G.combo = 0; G.scoreWhy = 'Se fue por esperar demasiado';
  hurt(12);
  G.note = `${G.front.name} se fue por esperar demasiado −3, calificación baja`;
  setComplaint('¡Llevo muchísimo esperando! Me voy.');
  G.staffMood = 'worried'; G.staffUntil = Date.now() + 1200; G.staffLine = 'Ya es tarde…';
  sfx('leave');
  advanceFront();
}

function endCounter() {
  if (cfg().mass || cfg().appt) return finish();
  G.stop = null;
  G.phase = 'remind'; G.t = REMIND_MS; G.totalT = REMIND_MS;
  G.front = null; G.queue = []; G.complaint = null; G.jumper = null; G.pending = null; G.choice = null;
  G.note = G.booked.length
    ? `Recepción terminada: ${G.booked.length} pacientes vendrán más tarde. El número en cada botón es la « probabilidad de no asistir ».`
    : 'Recepción terminada: hoy nadie fue agendado, así que no hay pacientes con hora.';
  render();
}

/* 提醒 */
function noShowChance(p, opt) {
  const f = REMIND_OPTS.find(o => o.key === opt).factor;
  return p.risk * f;
}
function setRemind(id, opt) {
  if (G.phase !== 'remind') return;
  const p = G.booked.find(x => x.id === id);
  if (!p) return;
  const oldCost = REMIND_OPTS.find(o => o.key === p.remind).cost;
  const newCost = REMIND_OPTS.find(o => o.key === opt).cost;
  if (G.credits + oldCost < newCost) { G.note = 'No le alcanzan los recordatorios.'; render(); return; }
  G.credits += oldCost - newCost;
  p.remind = opt;
  G.note = '';
  render();
}

function endRemind() {
  if (G.phase !== 'remind') return;
  G.phase = 'reveal'; G.t = REVEAL_MS; G.totalT = REVEAL_MS;
  let a = 0, n = 0;
  for (const p of G.booked) {
    const noShowP = noShowChance(p, p.remind);
    p.shownChance = noShowP;
    if (Math.random() >= noShowP) {
      p.arrived = true; G.score += 10; G.scoreWhy = 'Llegó puntual a su atención'; G.stats.arrived++; a++;
      flashQ(`r-${p.id}`, 'ok', '+10');
    } else {
      p.arrived = false; G.stats.noshow++; n++;
      flashQ(`r-${p.id}`, 'bad');
    }
  }
  G.revealShown = 0; G.revealAcc = 0;
  if (G.booked.length) G.t = G.totalT = G.booked.length * REVEAL_STEP_MS + 2500;   // Tras revelar todo, se espera 2.5 segundos
  G.stats.booked += G.booked.length;
  G.note = G.booked.length ? `Resultado: ${a} llegaron a tiempo, ${n} no llegaron.` : 'Hoy no hubo atenciones agendadas, así que no hay resultados que revelar.';
  sfx('reveal');
  render();
}

function endDay() {
  if (G.phase !== 'reveal') return;
  G.phase = 'dayend';
  const bonus = G.credits * 2;
  G.score += bonus;
  G.note = bonus ? `Los ${G.credits} recordatorios restantes se cambian por +${bonus} puntos` : '';
  render();
}

/* 每天結束後：選一項升級（最後一天直接看結果） */
function nextDay() {
  if (G.phase !== 'dayend') return;   // Clics repetidos se ignoran, para que la pantalla no salte a otra etapa
  if (G.day >= 1) return finish();   // El juego 1 termina al llegar al día 2
  G.upgradeChoices = shuffle(UPGRADES).slice(0, 3);
  G.phase = 'upgrade';
  render();
}

function chooseUpgrade(i) {
  if (G.phase !== 'upgrade') return;
  const u = G.upgradeChoices[i];
  if (!u) return;
  u.apply();
  G.lastUpgrade = u.name;
  sfx('upgrade');
  startDay(G.day + 1);
  G.note = `Mejora obtenida: ${u.name} (${u.desc})`;
  render();
}

function finish() {
  if (G.day === 3) return finishBonus();
  G.phase = 'end';
  const s = G.stats;
  G.rate = s.booked ? Math.round(s.arrived / s.booked * 100) : 0;
  const decided = s.correct + s.wrong + s.timeout;
  G.accuracy = decided ? Math.round(s.correct / decided * 100) : 0;
  const rateOK = s.booked ? G.rate >= 70 : true, rateMid = s.booked ? G.rate >= 50 : true;
  let grade = (rateOK && G.accuracy >= 75) ? 'Fluido'
    : (rateMid && G.accuracy >= 55) ? 'Algo de atasco' : 'Gran caos';
  if (G.stars <= 1 && grade === 'Fluido') grade = 'Algo de atasco';
  G.grade = grade;
  if (G.day === 2) unlockBonus();
  G.note = '';
  if (grade === 'Fluido') { sfx('win'); confetti(60); } else if (grade === 'Gran caos') sfx('lose');
  render();
}

/* 每 100 毫秒一次 */
function loop() {
  if (!G || G.paused || G.modal) return;
  if (G.phase === 'counter' && G.countdown > 0) {
    G.cdAcc = (G.cdAcc || 0) + 100;
    if (G.cdAcc >= 1000) {
      G.cdAcc = 0; G.countdown--;
      if (G.countdown > 0) sfx('tick'); else { sfx('start'); startPlay(); }
      render();
    }
    return;
  }
  if (G.phase === 'counter') {
    if (cfg().appt) { apptTick(); return; }
    G.t -= 100; G.spawnAcc += 100; G.ruleAcc += 100;
    let changed = false;
    // 每過 30 秒人潮變多（只有有 ramp 的關卡）
    if (cfg().ramp) {
      const stage = Math.floor((G.totalT - G.t) / 30000);
      if (stage > G.rampStage) {
        G.rampStage = stage; G.rampFactor = Math.max(0.45, G.rampFactor * 0.8);
        G.patFactor = Math.max(0.6, (G.patFactor || 1) * 0.92);
        G.note = '🕒 ¡Hay más gente! Los pacientes llegan más rápido y se impacientan antes.'; changed = true;
      }
    }
    // 到了設定的時間，加入年齡層條件（第一天約 45 秒）
    if (cfg().stages) {
      const el = G.totalT - G.t;
      const idx = el < DAY1_STAGES[0].end ? 0 : el < DAY1_STAGES[1].end ? 1 : 2;
      if (idx > (G.stageIdx || 0)) {
        G.stageIdx = idx; G.poolNow = DAY1_STAGES[idx].keys;
        G.freshKey = DAY1_STAGES[idx].newKey; G.freshUntil = Date.now() + 3000;
        changed = true;   // Ya no se muestra el aviso de « nueva condición », para ahorrar espacio
      }
    }
    if (G.complaint && Date.now() > G.complaintUntil) { G.complaint = null; changed = true; }
    if (G.staffMood !== 'neutral' && Date.now() > G.staffUntil) { G.staffMood = 'neutral'; G.staffLine = '¡Que hoy todo salga bien!'; changed = true; }
    if (cfg().mass) {
      if (massTick()) changed = true;
    } else if (G.spawnAcc >= spawnBase() * G.spawnFactor * G.rampFactor * dynSpawnFactor() && Date.now() >= (G.restUntil || 0) && !(cfg().phased && G.dayPhase === 3)) {
      G.spawnAcc = 0;
      if (!G.front || G.queue.length + 1 < MAX_QUEUE) {
        const jumpOK = G.front && !G.jumper && G.stats.total > 3 && Math.random() < cfg().jump;
        if (jumpOK) makeJumper();
        else if (cfg().pair && !cfg().phased && G.queue.length + 2 <= MAX_QUEUE && Math.random() < (cfg().pairChance || 0.25)) spawnPair();
        else spawn();
        if (!G.choice) changed = true;
      }
    }
    if (G.jumper) {
      G.jumperLeft -= 100;
      if (G.jumperLeft <= 0) {
        // 時間到還沒決定：等同請他排隊
        const j = G.jumper; G.queue.push(j); G.jumper = null; changed = true;
        if (j.jumpUrgent) { jumperJudge(false, -5, 'Nadie le prestó atención al urgente', 'Se acabó el tiempo y no se decidió.'); setComplaint('¡Era urgente y nadie me atiende!'); }
      }
    }
    // 今日公告：中途改寫其中一條規則，1 秒後生效
    if (cfg().announce && !G.announced && G.t <= cfg().counterMs / 2) {
      G.announced = true;
      const r = pick(G.rules), v = pick(others(rangeOf(r), G.open[r]));
      G.pending = {r, v, at: Date.now() + 1000};
      G.note = `📢 Aviso: ${RULE_NAME[r]} cambia a « ${v} », se aplica en 1 segundo`;
      changed = true;
    }
    if (G.pending && Date.now() >= G.pending.at) {
      G.open[G.pending.r] = G.pending.v;
      G.note = `📢 Aviso vigente: ${RULE_NAME[G.pending.r]} ahora es « ${G.pending.v} »`;
      G.pending = null; changed = true;
    }
    // 同事請假時門口暫停：正在等的病人耐心先不減少，避免卡死
    if (G.front && !(G.evt && G.evt.type === 'leave')) {
      G.front.patience -= 100;
      if (G.front.patience <= 0) {
        ghostLeave(G.front, 'impatient', 'left', '¡Llevo muchísimo esperando!');
        timeoutFront(); changed = true;
      }
    }
    // 選下一位：候選人耐心會持續減少，時間到或只剩一人就自動叫
    if (G.choice) {
      G.choiceLeft -= 100;
      G.choice.forEach(c => c.patience -= 100);
      const gone = G.choice.filter(c => c.patience <= 0);
      if (gone.length) {
        G.choice = G.choice.filter(c => c.patience > 0);
        G.stats.timeout += gone.length; G.combo = 0;
        gone.forEach(g => { G.score -= URG[g.urgency].pen; G.scoreWhy = 'Se fue por esperar demasiado'; hurt(URG[g.urgency].star * 12); });
        G.note = `${gone.map(g => g.name).join('、')} se fueron por esperar demasiado（${gone.map(g => URG[g.urgency].label + ' −' + URG[g.urgency].pen).join('、')}）`;
        setComplaint('¡Llevo muchísimo esperando! Me voy.');
        changed = true;
      }
      if (G.choice && G.choice.length === 0) { G.choice = null; advanceFront(); changed = true; }
      else if (G.choice && G.choiceLeft <= 0) {
        const urgent = G.choice.reduce((m, c, i) => (c.patience < G.choice[m].patience ? i : m), 0);
        pickNext(urgent, true); changed = true;
      }
    }
    if (!G.front && G.queue.length && !G.choice) { advanceFront(); changed = true; }
    // 保險：櫃台如果空著，就立刻叫一位病人
    if (!cfg().mass && !(cfg().phased && G.dayPhase >= 3) && !G.front && !G.queue.length && !G.jumper && !G.choice) {
      G.refillAcc = (G.refillAcc || 0) + 100;
      if (G.refillAcc >= (G.refillIn || 1000)) { G.refillAcc = 0; spawn(); changed = true; }
    }
    // 停診任務處理完、櫃台也空了：不再乾等，直接結束這一天
    // 第二天分段：暖身 → 固定雙人排序 → 臨時停診任務
    if (cfg().phased) {
      const el0 = G.totalT - G.t;
      if (!G.evtDone && el0 >= G.evtAt) {
        G.evtDone = true; G.evt = {type: G.evtType, endEl: el0 + (G.evtType === 'crash' ? 4000 : 12000)};
        G.note = G.evtType === 'crash' ? '🖥️ ¡Falla del computador! Las condiciones no se ven por un momento; decida de memoria' : '🚪 Compañero con permiso: la salida no se puede usar por ahora';
        changed = true;
      }
      if (G.evt && el0 >= G.evt.endEl) { G.evt = null; G.note = 'El sistema volvió a la normalidad'; releaseHeld(); changed = true; }
    }
    if (cfg().phased) {
      const el = G.totalT - G.t;
      const ph = el >= DAY2_MIX_AT ? 4 : el >= DAY2_STOP_AT ? 3 : el >= DAY2_EMG_AT[0] ? 2 : 1;
      if (ph > G.dayPhase) { G.dayPhase = ph; G.note = DAY2_NOTE[ph] || G.note; changed = true; if (ph === 3) startStop(); }
      if (ph === 4) {
        const win = DAY2_WIN.some(([a, b]) => el >= a && el < b);
        if (win !== !!G.winOpen) {
          if (!win && G.front && G.front.dept === 'Medicina' && !G.front.emergency) G.winLinger = G.front;
          G.winOpen = win;
          G.note = win ? '📣 « Medicina → Avisar y reagendar » abierto: los pacientes de Medicina van aquí' : 'Cerró la ventana de « Avisar y reagendar » de Medicina; los demás pacientes siguen las condiciones normales';
          changed = true;
        }
      }
      if (G.pairIdx < DAY2_PAIR_AT.length && el >= DAY2_PAIR_AT[G.pairIdx]) {
        G.pairIdx++; spawnScheduledPair(); changed = true;
      }
      if (G.emgIdx < DAY2_EMG_AT.length && el >= DAY2_EMG_AT[G.emgIdx]) {
        G.emgIdx++; spawnScheduledEmergency(); changed = true;
      }
    }
    // 排隊走道：排隊的人耐心會慢慢減少
    if (cfg().walk) {
      G.queue.forEach(q => { q.patience -= 100; });
      const lost = G.queue.filter(q => q.patience <= 0);
      if (lost.length) {
        G.queue = G.queue.filter(q => q.patience > 0);
        lost.forEach(q => { G.stats.timeout++; G.score -= URG[q.urgency].pen; G.scoreWhy = 'Los que esperaban en el pasillo se fueron'; hurt(URG[q.urgency].star * 12); });
        G.note = `${lost.map(q => q.name).join('、')} esperaron demasiado en el pasillo y se fueron`;
        setComplaint('¡Llevo muchísimo esperando! Me voy.');
        changed = true;
      }
    }
    if (G.t <= 0) { endCounter(); return; }
    if (changed) render(); else updateCounterBits();
  } else if (G.phase === 'remind') {
    G.t -= 100;
    if (G.t <= 0) endRemind(); else updateTimer();
  } else if (G.phase === 'reveal') {
    G.t -= 100;
    G.revealAcc = (G.revealAcc || 0) + 100;
    if ((G.revealShown || 0) < G.booked.length && G.revealAcc >= REVEAL_STEP_MS) { G.revealAcc = 0; revealOne(); }
    if (G.t <= 0) endDay(); else updateTimer();
  }
}

function updatePairBits() {
  if (!G.choice) return;
  const big = document.querySelector('.pair .bar.big i');
  if (big) big.style.width = (G.choiceLeft / CHOICE_MS * 100) + '%';
  document.querySelectorAll('.pair .pcand').forEach((el, i) => {
    const c = G.choice[i], bar = el.querySelector('.cbar i');
    if (c && bar) bar.style.width = Math.max(0, c.patience / CHOICE_MS * 100) + '%';
  });
}
function updateCounterBits() {
  if (cfg().appt) { updateApptBits(); updateTimer(); return; }
  if (cfg().mass) { updateTriageBits(); updateTimer(); return; }
  updatePairBits();
  const b = $('#pbar');
  if (b && G.front) {
    const ratio = G.front.patience / G.maxPatience;
    b.style.width = (ratio * 100) + '%';
    b.classList.toggle('low', ratio < 0.35);
  }
  updateTimer();
}
function updateTimer() {
  const el = $('#timer');
  if (el) el.textContent = Math.ceil(G.t / 1000) + ' s';
  const bar = $('#tprogbar');
  if (bar && G.totalT) {
    const ratio = Math.max(0, Math.min(1, G.t / G.totalT));
    bar.style.width = (ratio * 100) + '%';
    const box = $('#tprog');
    if (box) box.className = 'tprog ' + (ratio < 0.15 ? 'crit' : ratio < 0.3 ? 'warn' : 'ok');
  }
}

  seenIds.add(id);
  return 'arrive';
}

  const timed = ['counter', 'remind', 'reveal'].includes(G.phase);

  return `<div>${G.lastUpgrade ? `<span class="event upchip">🛠 Mejora de la semana: ${G.lastUpgrade}</span>` : ''}</div>

      <span class="hudright"><span id="timer">${timed ? Math.ceil(G.t / 1000) + ' s' : ''}</span>${pauseBtn}</span></div>
    ${timed ? `<div class="tprog ${tcls}" id="tprog"><i id="tprogbar" style="width:${ratio * 100}%"></i></div>` : ''}
    <div class="hud"><span class="stars">${stars(G.stars)}</span>

    ${G.phase === 'remind' ? `<div class="hud"><span>Recordatorios disponibles <b>${G.credits}</b></span></div>` : ''}
    ${G.note ? `<div class="note">${G.note}</div>` : '<div class="note"></div>'}`;
}

function updateTriageBits() {

}
// 傷患送進急救床：重傷要先送，送錯順序扣分
// 大型車禍：傷患陸續進來（重、中、輕隨機）
// 依 START 檢傷法產生傷患：先決定真實分類，再產生對應的觀察數據
function makeCasualty() {
  const p = newPatient();
  p.disaster = true; p.patience = 12000;
  p.cat = pick(['red', 'red', 'yellow', 'yellow', 'green']);
  const k = {walk: false, rr: 16 + Math.floor(Math.random() * 7), cap: 1.2, cmd: true};
  if (p.cat === 'green') {
    k.walk = true; k.rr = 14 + Math.floor(Math.random() * 7);
  } else if (p.cat === 'red') {
    const why = pick(['rr', 'cap', 'cmd']);
    if (why === 'rr') k.rr = 31 + Math.floor(Math.random() * 8);
    if (why === 'cap') k.cap = +(2.5 + Math.random() * 2).toFixed(1);
    if (why === 'cmd') k.cmd = false;
  } else {
    k.rr = Math.random() < 0.25 ? 28 + Math.floor(Math.random() * 2) : 16 + Math.floor(Math.random() * 9); // A veces queda cerca del límite de 30
  }
  p.trueCat = p.cat;   // Clasificación real: se usa para descontar si se clasificó mal o si empeoró por esperar demasiado
  p.clues = k;
  return p;
}
// 說明分類的理由（判斷後顯示，讓玩家知道為什麼）
function whyCat(c) {
  const k = c.clues;
  if (c.cat === 'green') return 'Puede caminar solo → 🟢 Leve (puede esperar, pasa a atención rápida)';
  if (c.cat === 'red') {
    if (k.rr > 30) return `Respiración ${k.rr} por minuto, sobre 30 → 🔴 Inmediato`;
    if (k.cap > 2) return `Llenado capilar de ${k.cap} s, sobre 2 s → 🔴 Inmediato`;
    return 'No obedece órdenes simples → 🔴 Inmediato';
  }
  return `No puede caminar, pero respira ${k.rr}, llenado capilar normal y obedece órdenes → 🟡 Diferido`;
}
// 檢傷：把傷患拖到紅／黃／綠區
function triage(ci, cat) {
  const c = G.casualties[ci]; if (!c) return;
  const reason = whyCat(c);
  if (cat === c.cat) {
    G.score += 10; G.stats.correct++; G.combo++; sfx('ok');
    G.lastJudge = {ok: true, title: `✓ ${CAT_NAME[cat]} correcto +10`, body: reason, until: Date.now() + 6000};
    G.note = `${c.name} clasificado como ${CAT_NAME[cat]}, correcto +10` + eduTip('bonus');
  } else {
    G.score -= 5; G.stats.wrong++; G.combo = 0; hurt(8); sfx('bad');
    G.lastJudge = {ok: false, title: `✗ Lo clasificaste como ${CAT_NAME[cat]}, debía ser ${CAT_NAME[c.cat]}, −5, calificación baja`, body: reason, until: Date.now() + 6000};
    G.note = `${c.name}: clasificación incorrecta −5, calificación baja`;
  }
  c.cat = cat;               // Se envía a la zona según la clasificación que elegiste (la real sigue siendo trueCat)
  G.casualties.splice(ci, 1);
  c.patience = WAIT_MS[cat];
  G.waitRoom.push(c);
  routeWaiting();
  render();
}
// 自動分流：紅先進急救床、黃進空的治療床、綠進快速處置（最多 3 人）
function bayOut(b) { return false; }   // Mantención de camas cancelada
function routeWaiting() {
  const order = {red: 0, yellow: 1, green: 2};
  G.waitRoom.sort((a, b) => order[a.cat] - order[b.cat]);
  for (const p of [...G.waitRoom]) {
    let bay = null;
    if (p.cat === 'red') bay = G.bays.find(b => b.kind === 'red' && !b.p);
    else if (p.cat === 'yellow') bay = G.bays.find(b => b.kind === 'bed' && !b.p && !bayOut(b));
    else if (G.minor.length < 3) {
      G.minor.push({p, left: TREAT.green});
      G.waitRoom = G.waitRoom.filter(x => x !== p);
      continue;
    }
    if (bay) {
      bay.p = p; bay.left = TREAT[p.cat];
      G.waitRoom = G.waitRoom.filter(x => x !== p);
    }
  }
}
// 等太久沒送到治療區或沒分類：依真實嚴重度扣分
function missed(p, where) {
  const real = p.trueCat || p.cat;
  const m = MISS_PEN[real];
  G.stats.timeout++; G.combo = 0; G.score -= m.pen; hurt(m.star * 12);
  G.note = `${p.name} (${CAT_NAME[real]}) empeoró en ${where} −${m.pen}${m.star ? ', calificación baja' : ''}`;
  sfx('leave');
}
// 第三天每 100 毫秒呼叫一次；回傳是否需要重畫
// 救護車一批送來：中途（約 40 秒）一次進來 4 位傷患（紅、黃、黃、綠），不受櫃台上限限制，容易塞車
function makeCasualtyOf(cat) {
  let p; do { p = makeCasualty(); } while (p.cat !== cat);
  return p;
}
function massTick() {
  let changed = false;
  if (!G.disasterDone && G.totalT - G.t >= 25000) {
    G.disasterDone = true;
    const batch = shuffle(['red', 'yellow', 'yellow', 'green']).map(makeCasualtyOf);
    G.casualties.push(...batch);
    G.note = '🚨 ¡Accidente masivo! La ambulancia trajo 4 heridos de una vez';
    apptBurst('🚨 ¡Accidente masivo!');
    G.modal = {title: '🚨 ¡Accidente masivo!', body: 'Clasifíquelos lo antes posible y llévelos a las camas correspondientes.', btn: 'Empezar a clasificar ▶', action: null};
    sfx('bad'); changed = true;
  }
  if (G.spawnAcc >= spawnBase() * G.spawnFactor * G.rampFactor && G.casualties.length < 3) {
    G.spawnAcc = 0; G.casualties.push(makeCasualty()); changed = true;
  }
  G.casualties.forEach(c => { c.patience -= 100; });
  const gone = G.casualties.filter(c => c.patience <= 0);
  if (gone.length) { G.casualties = G.casualties.filter(c => c.patience > 0); gone.forEach(c => missed(c, 'recepción')); changed = true; }
  G.waitRoom.forEach(p => { p.patience -= 100; });
  const worse = G.waitRoom.filter(p => p.patience <= 0);
  if (worse.length) { G.waitRoom = G.waitRoom.filter(p => p.patience > 0); worse.forEach(p => missed(p, 'sala de espera')); changed = true; }
  G.bays.forEach(b => {
    if (!b.p) return;
    b.left -= 100;
    if (b.left <= 0) { G.note = `${b.p.name} terminó su atención y dejó ${bayName(b)}`; b.p = null; changed = true; }
  });
  G.minor = G.minor.filter(m => {
    m.left -= 100;
    if (m.left <= 0) { G.note = `${m.p.name} terminó la atención rápida`; changed = true; return false; }
    return true;
  });
  const before = G.waitRoom.length;
  routeWaiting();
  if (G.waitRoom.length !== before) changed = true;
  return changed;
}
function swapQueue(i, j) {
  if (i === j || !G.queue[i] || !G.queue[j]) return;
  [G.queue[i], G.queue[j]] = [G.queue[j], G.queue[i]];
  render();
}

// 內科停診時，內科病人不能用按鈕處理，只能拖到其他科別轉診
function closedHere(p) { return !!(G.closed && p.dept === G.closed && !p.emergency); }
// 分診台：三間診間＋門口，拖曳病人到對應區域
function zonesHTML() {
  const stopOn = stopOpen();
  // 只有「受停診影響」的病人才看到內科轉診；不受影響的病人照一般規則處理
  const frontAff = !!(G.front && G.front.dept === 'Medicina' && !G.front.emergency && (stopOn || (G.front.fromStop && G.front.stopAff)));
  const frontStopNot = !!(G.front && G.front.fromStop && !G.front.stopAff);
  const transferring = closedHere(G.front) || frontAff;
  const z = d => (G.closed === d)
    ? `<div class="zone closed" data-zone="${d}">❌ ${d}<br><small>Suspendido, no se puede agendar atención</small></div>`
    : (frontAff && d === 'Medicina')
      ? `<div class="zone transfer" data-zone="Medicina">📣 Medicina → Avisar y reagendar<br><small>Avisar y reagendar (no mandar a la salida)</small></div>`
      : `<div class="zone" data-zone="${d}">${VAL_ICON.dept[d]} ${d}</div>`;
  const tip = (G.front && G.front.emergency) ? (G.front.notified ? '🚑 Ya avisó al equipo de salud; arrastre a la especialidad para agendar' : '🚑 Urgencia: primero arrástrelo a « Avisar al equipo de salud para evaluación »') : frontAff
    ? '📣 Paciente de Medicina suspendida: arrástrelo a « Medicina → Avisar y reagendar »: avisar y reagendar, no mandarlo a la salida'
    : frontStopNot
      ? '📣 Este paciente no se ve afectado por la suspensión; se evalúa con las condiciones normales'
      : '👆 Arrástrelo a la especialidad correspondiente para agendar; si no cumple, a la salida';
  const notify = (G.front && G.front.emergency && !G.front.notified) ? '<div class="zone transfer wide" data-zone="notify">🚑 Avisar al equipo de salud para evaluación<br><small>Primero avise, luego agenda la atención</small></div>' : '';
  const resched = G.closed ? '<div class="zone transfer" data-zone="resched">📣 Avisar y reagendar<br><small>Esperando un nuevo horario</small></div>' : '';
  return `<div class="zones"><div class="dragtip">${tip}</div>${notify}${DEPTS.map(z).join('')}${resched}${G.evt && G.evt.type === 'leave' ? '<div class="zone hold" data-zone="hold">🪑 Pedir que espere<br><small>Salida con permiso, se atiende después</small></div>' : '<div class="zone door" data-zone="door">🚪 Salida</div>'}</div>`;
}

function remindStatsHTML() {
  const used = G.booked.reduce((s, p) => s + REMIND_OPTS.find(o => o.key === p.remind).cost, 0);
  const total = used + G.credits;
  const exp = G.booked.reduce((s, p) => s + (1 - noShowChance(p, p.remind)), 0);
  return `<div class="card center"><b>Recordatorios usados: ${used}／${total}</b><br><b>Asistencia esperada según simulación: ${exp.toFixed(1)}／${G.booked.length} personas</b>
    <div class="muted" style="font-size:12px">El valor esperado es la suma de las probabilidades de cada paciente; no es una predicción real de asistencia.</div></div>`;
}
function remindHTML() {
  const n = G.booked.length;
  const cards = G.booked.map(p => `
    <div class="card">
      <div class="row">${avatar(p, 'neutral', 'sm')}
        <div style="flex:1"><b>${p.name}</b>
          ${p.history ? '<span class="tag warn">Faltó la última vez</span>' : '<span class="tag">Sin faltas anteriores</span>'}

          ${p.reason ? `<small class="muted">Motivo de la hora: ${p.reason.label}</small>` : ''}
        </div>
      </div>
      <div class="seg">${REMIND_OPTS.map(o => `
        <button class="${p.remind === o.key ? 'on' : ''}" data-act="remind" data-id="${p.id}" data-opt="${o.key}">
