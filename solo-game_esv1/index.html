  return `${remindStatsHTML()}
    ${n ? cards : '<div class="card center">Hoy no hay pacientes agendados (los que deben volver o las urgencias no tienen hora) 😴</div>'}

}

function revealOne() {
  const p = G.booked[G.revealShown || 0];
  G.revealShown = (G.revealShown || 0) + 1;
  if (p) sfx(p.arrived ? 'ok' : 'bad');
  render();
}
function revealAll() {
  if (G.phase !== 'reveal') return;
  G.revealShown = G.booked.length; render();
}
function revealDeltaHTML() {
  if (!G.booked.length) return '';
  const seen = G.booked.slice(0, G.revealShown || 0);
  const reminded = G.booked.filter(p => p.remind && p.remind !== 'none').length;
  const came = seen.filter(p => p.arrived).length;
  const d = G.booked.reduce((s, p) => s + (noShowChance(p, 'none') - noShowChance(p, p.remind)), 0);
  return `<div class="rsum">
    <div class="rbig"><span class="rnum">${reminded}</span><small>pacientes con recordatorio</small></div>
    <div class="rbig"><span class="rnum">${came}<small>／${seen.length}</small></span><small>Revelados・llegaron a tiempo</small></div>
    <div class="rnote">El recordatorio aumentó la asistencia esperada en ${d.toFixed(1)} personas (cada resultado puede variar)</div></div>`;
}
function revealHTML() {
  const shown = G.revealShown || 0;
  const n = G.booked.length;
  const cards = G.booked.map((p, i) => {
    const on = i < shown;
    const cls = on ? (p.arrived ? 'ok' : 'no') + (i === shown - 1 ? ' new' : '') : 'hid';
    return `
    <div class="tile ${cls}" data-key="r-${p.id}">
      <i class="rface">${on ? (p.arrived ? '😊' : '😶') : '❔'}</i><b>${p.name}</b><span>${on ? (p.arrived ? '✓ Llegó' : '✗ No llegó') : '…'}</span>
    </div>`;
  }).join('');
  const footer = !n ? '' : shown < n
    ? '<button class="pt-sec" data-act="revealall">Revelar todo</button>'
    : '<button data-act="dayendnow">Ver resultado del día ➜</button>';
  return `${revealDeltaHTML()}${cards ? `<div class="tilegrid">${cards}</div>` : '<div class="card center">Hoy no hubo pacientes agendados, así que no hay resultados</div>'}
    <p class="muted center">Una probabilidad baja también puede significar no asistir; eso es parte del azar.</p>${footer}`;
}

function dayendHTML() {

  G.waitlist.push(mk(tasks[1], true, true));
  G.waitlist.push(mk(tasks[2], false, true));
  G.waitlist.push(mk(tasks[3], true, true));

  for (let i = 0, n = 1 + Math.floor(Math.random() * 2); i < n; i++) G.waitlist.push(mk(pick(tasks), Math.random() < 0.8, Math.random() < 0.8));
  // 救援目標：依本局實際可成功安排的人數設定（最多 3）

  const evs = shuffle(['A', 'B', 'C', 'D']).slice(0, Math.random() < 0.5 ? 1 : 2);
  const rndTask = () => pick(tasks);
  if (evs.includes('A')) { const s = rndTask(); G.waitlist.push(mk(s, true, true, 'A')); }
  if (evs.includes('B')) { const s = rndTask(); G.waitlist.push(mk(s, true, false, 'B')); }

  G.rescueTarget = Math.min(3, G.waitlist.filter(c => c.consent && c.willing && tasks.some(s => s.svc === c.svc && s.time === c.time)).length);
  G.rescued = 0;

function apptHintToggle() { G.hintOn = !G.hintOn; render(); }

function apptFinish() {
  // 已取消、已改期的病人永遠不會被隨機改成確認；只有「還不確定」的人提醒後才可能回來
  G.appts.filter(a => a.state === 'pending' && a.kind === 'unsure').forEach(a => {
    if (!a.reminded && !a.skipped) { a.final = 'unhandled'; a.state = 'resolved'; return; }
    const yes = Math.random() < (a.reminded ? 0.6 : 0.25);
    a.final = yes ? 'confirmed' : 'noresp';
    if (yes) G.apptStats.confirmed++;
    a.state = 'resolved';
  });
  const candUnresolved = (G.pendingCand || []).length;
  G.slots.forEach(s => { if (s.state === 'notified' || s.state === 'pendingCand') s.state = 'open'; });
  G.pendingCand = [];
  const st = G.apptStats;
  const acc = G.stats.correct + G.stats.wrong ? G.stats.correct / (G.stats.correct + G.stats.wrong) : 0;
  let stars = 1;
  if (acc >= 0.6) stars = 2;
  if (acc >= 0.6 && G.rescued >= G.rescueTarget && G.apptErr <= 1) stars = 3;
  G.apptReport = {
    total: G.apptTotal, confirmed: st.confirmed, cancelled: st.cancelled,

    rebooked: st.rebooked, manual: st.manual,
    noReply: G.appts.filter(a => a.kind === 'unsure' && a.final === 'noresp').length + candUnresolved,

    rescued: G.rescued, rescueTarget: G.rescueTarget, maxStreak: G.apptMaxStreak,

// 階段完成：按「繼續」才進入下一階段（倒數停止）
function stageDone(sub) {

    G.modal = {title: '📩 Respuestas rápidas terminado', body: `Gestionaste ${A.handled}／${G.apptTotal} respuestas, racha máxima ×${G.apptMaxStreak}.<br>Confirmados ${conf}, cancelados ${G.appts.filter(a => isCancel(a) && a.state === 'done').length}, por seguimiento ${G.appts.filter(a => a.state === 'pending').length}.`, btn: 'Continuar: Campeón del emparejamiento →', action: 'apptA'};
  } else if (sub === 1) {

  } else {

      : 'Todavía quedan algunas tareas pendientes, ¡pero hiciste un gran trabajo!';

// 每 100 毫秒：來訊、配對回覆、突發事件、階段切換
function apptTick() {
  let changed = false;
  G.t -= 100;
  const elapsed = G.totalT - G.t;
  if (G.sub === 0) {
    G.arrAcc = (G.arrAcc || 0) + 100;
    const fast = elapsed >= 25000;
    if (fast && !G.speedNoted) { G.speedNoted = true; G.lastJudge = {ok: true, title: '📨 ¡Llegan más respuestas, póngase al día!', body: 'Las siguientes respuestas van a llegar más rápido.', until: Date.now() + 3000}; changed = true; }
    if (G.inboxQ.length && G.inbox.length < 2 && G.arrAcc >= (G.arrNext || 3000)) {
      G.arrAcc = 0; G.arrNext = fast ? 2000 + Math.floor(Math.random() * 1001) : 3000 + Math.floor(Math.random() * 2001);
      const a = G.inboxQ.shift(); a.state = 'inbox'; G.inbox.push(a); changed = true;
    }
    const allHandled = !G.inboxQ.length && !G.inbox.length;
    G.idleAcc = allHandled ? (G.idleAcc || 0) + 100 : 0;
    if (G.idleAcc >= 1500) G.t = 0;
  } else if (G.sub === 1) {
    if (G.skillHL && Date.now() >= (G.skillUntil || 0)) { G.skillHL = null; changed = true; }
    const frozen = Date.now() < (G.skillUntil || 0);   // Asistente inteligente: se pausa la cuenta regresiva de respuesta de los de lista de espera
    G.slots.forEach(s => {
      if (s.state !== 'notified' || frozen) return;
      s.left -= 100;
      if (s.left <= 0) { apptResolve(s); changed = true; }
    });
    // 突發事件 D：幸運配對（約 20 秒後出現）
    if (G.luckyWanted && !G.luckyDone && elapsed >= 20000) {
      G.luckyDone = true;
      const svc = pick(APPT_SVC), time = pick(APPT_TIMES), sid = 'lk' + Date.now();
      G.slots.push({id: sid, svc, time, state: 'open', left: 0, total: 6000, cand: null, from: 'lucky', task: false});
      G.waitlist.push({id: 'lc' + Date.now(), name: pick(NAMES), svc, time, consent: true, willing: true, fromId: null, slotId: sid, event: 'D'});
      G.lastJudge = {ok: true, title: '✨ ¡Apareció de repente una hora libre que calza con un paciente de lista de espera!', body: 'Revise la lista de espera; si empareja bien, hay un efecto especial.', until: Date.now() + 5000};
      changed = true;
    }
    // 突發事件 E：搶手空缺——一個時段、兩位都符合的候補，只能排一位，時段 16 秒後過期
    if (G.rushWanted && !G.rushDone && elapsed >= G.rushAt) {
      G.rushDone = true;
      const svc = pick(APPT_SVC), time = pick(APPT_TIMES), sid = 'rs' + Date.now();
      G.slots.push({id: sid, svc, time, state: 'open', left: 0, total: 6000, cand: null, from: 'rush', task: true, exp: 16000, expMax: 16000});
      G.taskTotal++;
      const n1 = pick(NAMES); let n2 = pick(NAMES); while (n2 === n1) n2 = pick(NAMES);
      [n1, n2].forEach((nm, k) => G.waitlist.push({id: 'rc' + k + sid, name: nm, svc, time, consent: true, willing: true, fromId: null, slotId: sid, event: 'E'}));
      G.lastJudge = {ok: true, title: '🔥 ¡Hora muy disputada! Dos pacientes quieren este horario', body: 'Sólo se puede dar a uno; el otro queda para después. ¡La hora se reserva sólo 16 segundos, decida rápido!', until: Date.now() + 5000};
      changed = true;
    }
    G.slots.forEach(s => {
      if (s.from !== 'rush' || s.state !== 'open') return;
      s.exp -= 100;
      if (s.exp <= 0) {
        s.state = 'expired'; G.taskTotal--; G.score = Math.max(0, G.score - 5); hurt(8); sfx('leave');
        G.lastJudge = {ok: false, title: '⏳ La hora disputada expiró, −5', body: 'Se acabó el tiempo de reserva y nadie fue agendado. La próxima vez decida más rápido.', until: Date.now() + 4000};
        changed = true;
      }
    });
    // 突發事件 C：來電
    G.subEl = (G.subEl || 0) + 100;
    const call = G.call;
    if (call && call.state === 'scheduled' && G.subEl >= call.at) { call.state = 'ringing'; call.left = 10000; changed = true; }
    if (call && call.state === 'ringing') {
      call.left -= 100;
      if (call.left <= 0) {
        call.state = 'missed'; hurt(6); sfx('bad'); changed = true;
        G.lastJudge = {ok: false, title: 'La llamada no fue contestada; la cancelación no quedó registrada', body: 'La hora no se libera; en estos casos hay que actuar rápido.', until: Date.now() + 5000};
      }
    }
    // 待辦全部完成 → 提早結束；沒有可做的事 → 稍後結束
    if (apptTaskDone() >= G.taskTotal && !G.call && !(G.luckyWanted && !G.luckyDone) && !G.slots.some(s => s.state === 'notified')) { G.idleAcc = (G.idleAcc || 0) + 100; if (G.idleAcc >= 1500) G.t = 0; }
    else if (!apptCanAct()) { G.idleAcc = (G.idleAcc || 0) + 100; if (G.idleAcc >= 2500) G.t = 0; }
    else G.idleAcc = 0;
  } else {
    const undecided = G.appts.some(a => a.state === 'pending' && a.kind === 'unsure' && !a.reminded && !a.skipped);
    G.idleAcc = undecided ? 0 : (G.idleAcc || 0) + 100;
    if (G.idleAcc >= 1500) G.t = 0;
  }
  if (G.t <= 0) { stageDone(G.sub); return; }
  if (changed) render(); else { updateTimer(); updateApptBits(); }
}
function updateApptBits() {

  G.slots.forEach(s => {

    if (s.state !== 'notified') return;

    if (el) el.style.width = Math.max(0, s.left / s.total * 100) + '%';
  });
}

  const dots = APPT_SUB.map((x, i) => `<span class="sd ${i < G.sub ? 'done' : i === G.sub ? 'now' : ''}">${i + 1}．${x.name.replace(/^\S+ /, '')}</span>`).join('');
  const j = G.lastJudge && Date.now() < G.lastJudge.until ? G.lastJudge : null;
  const judge = j ? `<div class="judge ${j.ok ? 'ok' : 'bad'}"><b>${j.title}</b><div>${j.body}</div></div>`
    : `<div class="judge idle">${sub.hint}</div>`;
  let body, progress;
  if (G.sub === 0) {
    progress = `Gestionadas ${G.apptStats.handled}／${G.apptTotal} respuestas｜Racha ×${G.apptStreak}｜Máxima ${G.apptMaxStreak}`;
    body = G.inbox.length
      ? G.inbox.map(apptMsgCard).join('')
      : '<div class="pcard center muted" style="padding:24px 0">Esperando la siguiente respuesta…</div>';
  } else if (G.sub === 1) {
    progress = `Completadas ${apptTaskDone()}／${G.taskTotal} tareas｜Avance de rescates de hoy: ${G.rescued}／${G.rescueTarget}`;
    body = apptMatchHTML();
  } else {
    progress = ''; body = '';   // El flujo de horas sólo tiene dos etapas; esta pantalla no aparece aquí
  }
  return `<div class="counter-scene">
    <div class="subhead">Etapa ${G.sub + 1}／${APPT_SUB.length}：${sub.name}</div>
    <div class="subdots">${dots}</div>
    <div class="taskprog">${progress}</div>
    ${judge}
    ${body}
    <div class="queue"><span class="muted" style="margin-left:auto">Quedan ${Math.ceil(G.t / 1000)} s en esta etapa</span></div>
  </div>`;
}
function apptReportHTML() {
  const r = G.apptReport;
  const items = [['Total de horas', r.total], ['Tasa de asistencia confirmada', r.confirmRate + '%'], ['Cancelaciones completadas', r.cancelled], ['Cambios pendientes', r.reschedPending],
    ['Reagendadas', r.rebooked], ['Gestión manual', r.manual], ['Sin respuesta', r.noReply], ['Pendientes por atender', r.unhandled],
    ['Avance de rescates', r.rescued + '／' + r.rescueTarget], ['Racha máxima', '×' + r.maxStreak], ['Eventos especiales', r.events], ['Puntaje final', r.score]];
  const title = r.stars >= 3 ? '🏆 ¡La mejor administradora del CESFAM de hoy!' : r.stars === 2 ? '👍 ¡Buen trabajo en los rescates!' : 'Todavía hay espacio para mejorar';
  const starRow = '★'.repeat(r.stars) + '☆'.repeat(3 - r.stars);
  return `<div class="card"><h3>${title} <span class="stars" style="font-size:18px">${starRow}</span></h3>
    <div class="reportgrid rep4">${items.map(([k, v]) => `<div class="rcell"><small>${k}</small><b>${v}</b></div>`).join('')}</div>
    <p class="muted" style="font-size:11px;margin:4px 0 0">La « tasa de asistencia confirmada » es el porcentaje de pacientes que respondieron confirmando; no es la asistencia real. Tres estrellas: completar las dos etapas, precisión de 60% o más, rescates cumplidos y máximo 1 error grave.</p></div>`;
}

function readUnlock() { try { return localStorage.getItem('clinic-bonus') === '1'; } catch (e) { return false; } }
function unlockBonus() {
  G.bonusUnlocked = true;
  try { localStorage.setItem('clinic-bonus', '1'); } catch (e) {}
}
function startBonus(fromMain) {
  if (fromMain) { G.mainScore = G.score; G.mainRep = G.rep; G.mainGrade = G.grade; G.mainReport = G.apptReport; G.mainDone = true; }
  else G.mainDone = false;
  G.score = 0; G._shownScore = 0; G.scoreHist = []; G.scoreChip = null; G.rep = 100; syncStars(); G.combo = 0; G.note = '';
  G.stats = {total: 0, correct: 0, wrong: 0, timeout: 0, booked: 0, arrived: 0, noshow: 0};
  G.complaint = null;
  startDay(3);
}
function backMain() {
  G.score = G.mainScore; G._shownScore = G.score; G.scoreHist = []; G.scoreChip = null; G.rep = G.mainRep; syncStars();
  G.grade = G.mainGrade; G.apptReport = G.mainReport;
  G.day = 2; G.phase = 'end'; G.note = '';
  render();
}
function finishBonus() {
  G.phase = 'end';
  const s = G.stats, decided = s.correct + s.wrong + s.timeout;
  G.accuracy = decided ? Math.round(s.correct / decided * 100) : 0;
  G.grade = (G.accuracy >= 75 && G.stars >= 3) ? 'Fluido' : G.accuracy >= 55 ? 'Algo de atasco' : 'Gran caos';
  G.note = '';
  if (G.grade === 'Fluido') { sfx('win'); confetti(60); } else if (G.grade === 'Gran caos') sfx('lose');
  render();
}

// 分數明顯呈現（計畫書 Phase 1 之後的需求）：每次加減分都顯示差額與原因
function updateScoreFx() {
  if (G._shownScore === undefined) G._shownScore = G.score;
  const d = G.score - G._shownScore;
  G._shownScore = G.score;
  if (!d) return;
  const raw = G.scoreWhy || (G.lastJudge && G.lastJudge.title) || G.note || '';
  G.scoreWhy = null;
  const why = raw.replace(/^[✓✗📨📞📣🙋🚑🕒🆕☕🔀🚫📢⚡\s]+/u, '').replace(/[+−-]\d+.*$/, '').split(/[:：（(]/)[0].trim().slice(0, 16);
  G.scoreHist = [{d, why}, ...(G.scoreHist || [])].slice(0, 3);
  G.scoreChip = {d, until: Date.now() + 2500};
  flashQ('score', d > 0 ? 'ok' : 'bad', (d > 0 ? '+' : '−') + Math.abs(d));
}
function scoreChipHTML() {
  const c = G.scoreChip;
  if (!c || Date.now() > c.until) return '';
  return `<span class="scorechip ${c.d > 0 ? 'pos' : 'neg'}">${c.d > 0 ? '+' : '−'}${Math.abs(c.d)}</span>`;
}
function scoreHistHTML() {
  const list = G.scoreHist || [];
  if (!list.length) return '';
  return `<div class="scorehist">${list.map(x => `<span class="${x.d > 0 ? 'pos' : 'neg'}">${x.d > 0 ? '+' : '−'}${Math.abs(x.d)} ${x.why}</span>`).join('')}</div>`;
}
function render() {
  updateScoreFx();
  const app = $('#app');
  // 第三天的頁面不需要底部留白（避免整頁多出一大段可以捲動的空間）
  app.classList.toggle('appt-day', !!(cfg() && cfg().appt));
  let html;
  try { html = buildHTML(); }
  catch (err) {
    // 畫面產生失敗時不要停在舊畫面，改顯示可以恢復的提示
    console.error(err);
    html = `<div class="card center"><h2>La pantalla tuvo un problema</h2><p class="muted">No se preocupe, el botón de abajo le permite volver a empezar la semana.</p><button data-act="restart">Empezar de nuevo</button></div>`;
  }
  app.innerHTML = html;
  flushFx();
}

const MODAL_ACTIONS = {
  apptA: () => apptLeaveA(),
  apptB: () => apptLeaveB(),
  apptEnd: () => apptFinish(),
  apptGo: () => apptGo()
};
function modalOK() {
  const m = G.modal; G.modal = null;
  if (m && m.action && MODAL_ACTIONS[m.action]) MODAL_ACTIONS[m.action]();

function buildHTML() {
  if (P) return patientHTML();
  let html;
  if (G.phase === 'intro') html = introHTML();
  else if (G.phase === 'tutorial') html = tutorialHTML();
  else if (G.phase === 'end') html = endHTML();
  else if (G.paused) html = hudHTML() + pauseHTML();
  else if (G.modal) html = hudHTML() + modalHTML();
  else if (G.phase === 'upgrade') html = hudHTML() + upgradeHTML();
  else {
    const body = {counter: counterHTML, remind: remindHTML, reveal: revealHTML, dayend: dayendHTML}[G.phase]();
    html = hudHTML() + body;
  }
  return html;
}

function flushFx() {
  for (const f of fxQ) {
    const el = document.querySelector(`[data-key="${f.key}"]`);
    if (!el) continue;
    if (f.kind === 'ok' || f.kind === 'bad') {
      el.classList.add('fx-' + f.kind);
      setTimeout(() => el.classList.remove('fx-' + f.kind), 800);
    }
    if (f.text) {
      const r = el.getBoundingClientRect();
      const d = document.createElement('div');
      d.className = 'float';
      d.textContent = f.text;
      d.style.color = f.kind === 'bad' ? '#d9534f' : '#1f8a70';
      d.style.left = (r.left + r.width / 2 - 20) + 'px';
      d.style.top = (r.top + r.height / 3) + 'px';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1300);
    }
  }
  fxQ = [];
}

/* ================= 點擊處理 ================= */
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  audio();   // Al primer clic se desbloquea el sonido
  const a = b.dataset.act;
  if (a === 'sound') toggleSound();
  else if (a === 'start') { G.gameId = 1; startDay(0); }
  else if (a === 'start2') { newGame(); G.gameId = 2; startDay(2); }
  else if (a === 'pass') decida(true);
  else if (a === 'deny') decida(false);
  else if (a === 'jumpyes') acceptJumper();
  else if (a === 'jumpno') declineJumper();
  else if (a === 'pick') pickNext(+b.dataset.i, false);
  else if (a === 'remind') setRemind(b.dataset.id, b.dataset.opt);
  else if (a === 'endremind') endRemind();
  else if (a === 'revealall') revealAll();
  else if (a === 'dayendnow') endDay();
  else if (a === 'nextday') nextDay();
  else if (a === 'upgrade') chooseUpgrade(+b.dataset.i);
  else if (a === 'tutprev') { G.tutPage = Math.max(0, G.tutPage - 1); render(); }
  else if (a === 'modalok') modalOK();
  else if (a === 'practice') practiceTap(b.dataset.zone);
  else if (a === 'practicepick') practicePick(+b.dataset.i);
  else if (a === 'tutnext') { G.tutPage = Math.min(TUTORIAL[G.day].length - 1, G.tutPage + 1); G.practiceDone = false; G.practiceMsg = null; render(); }
  else if (a === 'tutgo' || a === 'tutskip') { if (G.phase === 'tutorial') beginCounter(); }
  else if (a === 'pause') setPaused(true);
  else if (a === 'resume') setPaused(false);
  else if (a === 'quit') { if (G.quitArmed) newGame(); else { G.quitArmed = true; render(); } }
  else if (a === 'apt') apptAct(b.dataset.id, b.dataset.k);
  else if (a === 'aptcall') apptCall(b.dataset.k);
  else if (a === 'aptpick') apptPick(b.dataset.id);
  else if (a === 'aptslot') apptSlotTap(b.dataset.sid);
  else if (a === 'aptmanual') apptManual(b.dataset.id);
  else if (a === 'aptskill') apptSkill();
  else if (a === 'apthint') apptHintToggle();
  else if (a === 'aptpage') apptPage(+b.dataset.d);
  else if (a === 'bonus') startBonus(true);
  else if (a === 'bonusfromintro') { G.gameId = 3; startBonus(false); }
  else if (a === 'backmain') backMain();
  else if (a === 'restart') newGame();
  else if (a === 'patient') patientStart();
  else if (a === 'pt') { patientAct(b.dataset.k, b.dataset.v); render(); }
  else if (a === 'savescore') saveScore();
});

/* ================= 拖曳（分診台） ================= */
let drag = null;
function zoneAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('.zone') : null; }
document.addEventListener('pointerdown', (e) => {
  if (inPractice()) {
    const pc = e.target.closest('[data-drag]');
    if (pc) drag = {type: 'practice', card: pc, idx: 0, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
    return;
  }
  if (G.phase !== 'counter' || G.paused) return;
  let el = null, type = null, idx = -1;
  const card = e.target.closest('[data-drag]'), cas = e.target.closest('[data-cas]'), slot = e.target.closest('[data-slot]'), cand = e.target.closest('[data-cand]'), stopc = e.target.closest('[data-stop]');
  if (card && G.front) { el = card; type = 'front'; }
  else if (cas) { el = cas; type = 'cas'; idx = +cas.dataset.cas; }
  else if (slot) { el = slot; type = 'slot'; idx = +slot.dataset.slot; }
  else if (cand) { el = cand; type = 'cand'; idx = cand.dataset.cand; }
  else if (stopc) { el = stopc; type = 'stop'; idx = +stopc.dataset.stop; }
  if (!el) return;
  drag = {type, card: el, idx, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    const g = drag.card.cloneNode(true);
    g.classList.add('ghost'); g.removeAttribute('data-key');
    document.body.appendChild(g); drag.ghost = g;
  }
  drag.ghost.style.left = (e.clientX - 110) + 'px';
  drag.ghost.style.top = (e.clientY - 40) + 'px';
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  const z = zoneAt(e.clientX, e.clientY);
  if (z) z.classList.add('over');
  e.preventDefault();
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  if (!d.moved) return;
  const z = zoneAt(e.clientX, e.clientY);
  if (d.type === 'practice') {
    if (z && z.dataset.zone) practiceTap(z.dataset.zone);
    else G.practiceMsg = 'Arrastre al paciente a una sala de consulta';
    render();
  } else if (d.type === 'front') {
    if (z) decida(z.dataset.zone !== 'door', z.dataset.zone);
  } else if (d.type === 'cas') {
    const tz = zoneAt(e.clientX, e.clientY);
    if (tz && tz.dataset.zone) triage(d.idx, tz.dataset.zone);
    else { G.note = 'Arrastre al herido a la zona de triaje de color de abajo'; render(); }
  } else if (d.type === 'cand') {
    const sd = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slotdrop]');
    if (sd) apptSend(d.idx, sd.dataset.slotdrop);
    else { G.note = 'Arrastre al paciente de lista de espera a la hora libre'; render(); }
  } else if (d.type === 'slot') {
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]');
    if (target) swapQueue(d.idx, +target.dataset.slot);
  }
});

// 手指被系統中斷（例如來電、捲動）時，清掉拖曳殘留的影子卡片，避免畫面卡住
document.addEventListener('pointercancel', () => {
  if (drag && drag.ghost) drag.ghost.remove();
  drag = null;
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
});

function ptLookOf(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return {color: PALETTE[h % PALETTE.length], hair: HAIRS[h % HAIRS.length]};
}
// 訊息氣泡：who 為 'staff' 時是櫃台，否則是病人（依名字決定外觀）
function ptMsg(who, name, text) {
  const isStaff = who === 'staff';
  const look = isStaff ? STAFF : ptLookOf(name);
  return `<div class="pt-msg ${isStaff ? 'staff' : ''}"><div class="pt-av">${avatar(look, 'neutral', 'sm')}</div>
    <div class="pt-bub"><span class="pt-name">${isStaff ? 'Recepción' : name}</span>${text}</div></div>`;
}
function ptClear() { if (P && P.timer) clearTimeout(P.timer); }
function ptSchedule(ms, fn) {
  clearTimeout(P.timer);
  P.timer = setTimeout(() => { if (!P) return; fn(); render(); }, ms);
}
function ptAward(key, pts) { if (!P.got[key]) { P.got[key] = true; P.score += pts; } }
function patientStart() {
  ptClear();
  const pool = PT_PACKS.map((_, i) => i).filter(i => i !== PT_LAST);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  PT_LAST = idx;
  P = {stage: 1, step: 'ask', pack: PT_PACKS[idx], score: 0, firstTry: 0, got: {}, wrong: '',
       s1Att: 0, s3Att: 0, timer: null,
       opts: shuffle(['confirm', 'ask', 'ignore']), cands: shuffle(['good', 'bad1', 'bad2'])};
  render();
}
function patientExit() { ptClear(); P = null; render(); }
function patientAct(k, v) {
  if (!P) return;
  if (k === 'exit' || k === 'full') return patientExit();
  if (k === 'replay') return patientStart();
  if (P.stage === 1) {
    if (k === 'choice') {
      const first = P.s1Att === 0; P.s1Att++;
      if (v === 'ask') { if (first) P.firstTry++; ptAward('understand', 10); P.wrong = ''; P.step = 'reply'; sfx('ok'); }
      else { P.wrong = ptFill(v === 'confirm' ? PT_TXT.s1ConfirmWhy : PT_TXT.s1IgnoreWhy, ptVars()); sfx('bad'); }
    } else if (k === 'record') { ptAward('cancel', 10); P.step = 'cancelled'; sfx('ok'); }
    else if (k === 'next') { P.stage = 2; P.step = 'show'; }
  } else if (P.stage === 2) {
    if (k === 'open' && P.step === 'show') { P.step = 'open'; sfx('win'); confetti(20); }
    else if (k === 'next' && P.step === 'open') { P.stage = 3; P.step = 'ask'; }
  } else if (P.stage === 3) {
    if (k === 'cand') {
      const first = P.s3Att === 0; P.s3Att++;
      if (v === 'good') {
        if (first) P.firstTry++;
        ptAward('candidate', 10); P.wrong = ''; P.step = 'sending'; sfx('ok');
        ptSchedule(1500, () => {
          P.step = 'reply';
          ptSchedule(1500, () => { P.step = 'confirmed'; confetti(30); sfx('win'); });
        });
      } else { P.wrong = P.pack[v].why; sfx('bad'); }
    } else if (k === 'next') { ptAward('story', 10); P.stage = 4; }
  } else if (P.stage === 4) {
    if (k === 'next') P.stage = 5;
  }
}
