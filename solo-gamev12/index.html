}

// 階段完成：按「繼續」才進入下一階段（倒數停止）
function stageDone(sub) {
  const A = G.apptStats;
  if (sub === 0) {
    const conf = G.appts.filter(a => a.final === 'confirmed').length;
    G.modal = {title: '📩 訊息快手 完成', body: `處理了 ${A.handled}／${G.apptTotal} 則回覆，最長 Combo ×${G.apptMaxStreak}。<br>已確認 ${conf} 位，取消 ${G.appts.filter(a => isCancel(a) && a.state === 'done').length} 位，待追蹤 ${G.appts.filter(a => a.state === 'pending').length} 位。`, btn: '繼續：診位配對王 →', action: 'apptA'};
  } else if (sub === 1) {
    const done = apptTaskDone();
    const why = done >= G.taskTotal ? '<br>全部待辦完成，提早結束！' : (!apptCanAct() ? '<br>剩下的空缺沒有可以配對的人，提早結束。' : '');
    G.modal = {title: '🧩 診位配對王 完成', body: `已完成 ${done}／${G.taskTotal} 件待辦。<br>今日救援進度：${G.rescued}／${G.rescueTarget}${why}`, btn: '看今日成績 →', action: 'apptEnd'};
  } else {
    const undecided = G.appts.filter(a => a.state === 'pending' && a.kind === 'unsure' && !a.reminded && !a.skipped).length;
    const body = undecided === 0 ? '⚡ 最後救援成功！所有待確認的病患都處理了。'
      : '今天仍有一些待辦，但你已經努力處理大部分問題！';
    G.modal = {title: '⚡ 最後救援 完成', body: `${body}<br>提醒已發送 ${A.reminded} 次，剩餘額度 ${G.apptCredits}。`, btn: '看今日成績 →', action: 'apptEnd'};
  }
  G.lastJudge = null; G.idleAcc = 0; G.selCand = null;
  render();
}

// 每 100 毫秒：來訊、配對回覆、突發事件、階段切換
function apptTick() {
  let changed = false;
  G.t -= 100;
  const elapsed = G.totalT - G.t;
  if (G.sub === 0) {
    G.arrAcc = (G.arrAcc || 0) + 100;
    const fast = elapsed >= 25000;
    if (fast && !G.speedNoted) { G.speedNoted = true; G.lastJudge = {ok: true, title: '📨 病患回覆變多了，快跟上！', body: '後面的回覆會來得更快。', until: Date.now() + 3000}; changed = true; }
    if (G.inboxQ.length && G.inbox.length < 2 && G.arrAcc >= (G.arrNext || 3000)) {
      G.arrAcc = 0; G.arrNext = fast ? 2000 + Math.floor(Math.random() * 1001) : 3000 + Math.floor(Math.random() * 2001);
      const a = G.inboxQ.shift(); a.state = 'inbox'; G.inbox.push(a); changed = true;
    }
    const allHandled = !G.inboxQ.length && !G.inbox.length;
    G.idleAcc = allHandled ? (G.idleAcc || 0) + 100 : 0;
    if (G.idleAcc >= 1500) G.t = 0;
  } else if (G.sub === 1) {
    if (G.skillHL && Date.now() >= (G.skillUntil || 0)) { G.skillHL = null; changed = true; }
    const frozen = Date.now() < (G.skillUntil || 0);   // 智慧助手：候補回覆倒數暫停
    G.slots.forEach(s => {
      if (s.state !== 'notified' || frozen) return;
      s.left -= 100;
      if (s.left <= 0) { apptResolve(s); changed = true; }
    });
    // 突發事件 D：幸運配對（約 20 秒後出現）
    if (G.luckyWanted && !G.luckyDone && elapsed >= 20000) {
      G.luckyDone = true;
      const svc = pick(APPT_SVC), time = pick(APPT_TIMES), sid = 'lk' + Date.now();
      G.slots.push({id: sid, svc, time, state: 'open', left: 0, total: 6000, cand: null, from: 'lucky', task: false});
      G.waitlist.push({id: 'lc' + Date.now(), name: pick(NAMES), svc, time, consent: true, willing: true, fromId: null, slotId: sid, event: 'D'});
      G.lastJudge = {ok: true, title: '✨ 突然有空缺，剛好符合候補的需求！', body: '快看看候補名單，配對成功會有額外特效。', until: Date.now() + 5000};
      changed = true;
    }
    // 突發事件 E：搶手空缺——一個時段、兩位都符合的候補，只能排一位，時段 16 秒後過期
    if (G.rushWanted && !G.rushDone && elapsed >= G.rushAt) {
      G.rushDone = true;
      const svc = pick(APPT_SVC), time = pick(APPT_TIMES), sid = 'rs' + Date.now();
      G.slots.push({id: sid, svc, time, state: 'open', left: 0, total: 6000, cand: null, from: 'rush', task: true, exp: 16000, expMax: 16000});
      G.taskTotal++;
      const n1 = pick(NAMES); let n2 = pick(NAMES); while (n2 === n1) n2 = pick(NAMES);
      [n1, n2].forEach((nm, k) => G.waitlist.push({id: 'rc' + k + sid, name: nm, svc, time, consent: true, willing: true, fromId: null, slotId: sid, event: 'E'}));
      G.lastJudge = {ok: true, title: '🔥 搶手空缺！兩位候補都想要這個時段', body: '只能排一位，另一位要留到之後。時段只保留 16 秒，快選！', until: Date.now() + 5000};
      changed = true;
    }
    G.slots.forEach(s => {
      if (s.from !== 'rush' || s.state !== 'open') return;
      s.exp -= 100;
      if (s.exp <= 0) {
        s.state = 'expired'; G.taskTotal--; G.score = Math.max(0, G.score - 5); hurt(3); sfx('leave');
        G.lastJudge = {ok: false, title: '⏳ 搶手空缺過期了，−5', body: '時段保留時間到了，沒有人被安排進去。下次要更快決定。', until: Date.now() + 4000};
        changed = true;
      }
    });
    // 突發事件 C：來電
    G.subEl = (G.subEl || 0) + 100;
    const call = G.call;
    if (call && call.state === 'scheduled' && G.subEl >= call.at) { call.state = 'ringing'; call.left = 10000; changed = true; }
    if (call && call.state === 'ringing') {
      call.left -= 100;
      if (call.left <= 0) {
        call.state = 'missed'; hurt(6); sfx('bad'); changed = true;
        G.lastJudge = {ok: false, title: '來電沒有接起來，取消沒有被記錄', body: '時段不會釋出，這種來電要趕快處理。', until: Date.now() + 5000};
      }
    }
    // 待辦全部完成 → 提早結束；沒有可做的事 → 稍後結束
    if (apptTaskDone() >= G.taskTotal && !G.call && !(G.luckyWanted && !G.luckyDone) && !G.slots.some(s => s.state === 'notified')) { G.idleAcc = (G.idleAcc || 0) + 100; if (G.idleAcc >= 1500) G.t = 0; }
    else if (!apptCanAct()) { G.idleAcc = (G.idleAcc || 0) + 100; if (G.idleAcc >= 2500) G.t = 0; }
    else G.idleAcc = 0;
  } else {
    const undecided = G.appts.some(a => a.state === 'pending' && a.kind === 'unsure' && !a.reminded && !a.skipped);
    G.idleAcc = undecided ? 0 : (G.idleAcc || 0) + 100;
    if (G.idleAcc >= 1500) G.t = 0;
  }
  if (G.t <= 0) { stageDone(G.sub); return; }
  if (changed) render(); else { updateTimer(); updateApptBits(); }
}
function updateApptBits() {
  const ct = document.querySelector('[data-calltime]');
  if (ct && G.call) ct.textContent = Math.max(0, Math.ceil(G.call.left / 1000));
  G.slots.forEach(s => {
    if (s.from === 'rush' && s.state === 'open') { const r = document.querySelector(`[data-rbar="${s.id}"]`); if (r) r.style.width = Math.max(0, s.exp / s.expMax * 100) + '%'; return; }
    if (s.state !== 'notified') return;
    const el = document.querySelector(`[data-nbar="${s.id}"]`);
    if (el) el.style.width = Math.max(0, s.left / s.total * 100) + '%';
  });
}

function flushFx() {
  for (const f of fxQ) {
    const el = document.querySelector(`[data-key="${f.key}"]`);
    if (!el) continue;
    if (f.kind === 'ok' || f.kind === 'bad') {
      el.classList.add('fx-' + f.kind);
      setTimeout(() => el.classList.remove('fx-' + f.kind), 800);
    }
    if (f.text) {
      const r = el.getBoundingClientRect();
      const d = document.createElement('div');
      d.className = 'float';
      d.textContent = f.text;
      d.style.color = f.kind === 'bad' ? '#d9534f' : '#1f8a70';
      d.style.left = (r.left + r.width / 2 - 20) + 'px';
      d.style.top = (r.top + r.height / 3) + 'px';
      document.body.appendChild(d);
      setTimeout(() => d.remove(), 1300);
    }
  }
  fxQ = [];
}

/* ================= 拖曳（分診台） ================= */
let drag = null;
function zoneAt(x, y) { const el = document.elementFromPoint(x, y); return el ? el.closest('.zone') : null; }
document.addEventListener('pointerdown', (e) => {
  if (inPractice()) {
    const pc = e.target.closest('[data-drag]');
    if (pc) drag = {type: 'practice', card: pc, idx: 0, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
    return;
  }
  if (G.phase !== 'counter' || G.paused) return;
  let el = null, type = null, idx = -1;
  const card = e.target.closest('[data-drag]'), cas = e.target.closest('[data-cas]'), slot = e.target.closest('[data-slot]'), cand = e.target.closest('[data-cand]'), stopc = e.target.closest('[data-stop]');
  if (card && G.front) { el = card; type = 'front'; }
  else if (cas) { el = cas; type = 'cas'; idx = +cas.dataset.cas; }
  else if (slot) { el = slot; type = 'slot'; idx = +slot.dataset.slot; }
  else if (cand) { el = cand; type = 'cand'; idx = cand.dataset.cand; }
  else if (stopc) { el = stopc; type = 'stop'; idx = +stopc.dataset.stop; }
  if (!el) return;
  drag = {type, card: el, idx, x0: e.clientX, y0: e.clientY, moved: false, ghost: null};
});
document.addEventListener('pointermove', (e) => {
  if (!drag) return;
  if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 8) return;
  if (!drag.moved) {
    drag.moved = true;
    const g = drag.card.cloneNode(true);
    g.classList.add('ghost'); g.removeAttribute('data-key');
    document.body.appendChild(g); drag.ghost = g;
  }
  drag.ghost.style.left = (e.clientX - 110) + 'px';
  drag.ghost.style.top = (e.clientY - 40) + 'px';
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  const z = zoneAt(e.clientX, e.clientY);
  if (z) z.classList.add('over');
  e.preventDefault();
});
document.addEventListener('pointerup', (e) => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.ghost) d.ghost.remove();
  document.querySelectorAll('.zone.over').forEach(z => z.classList.remove('over'));
  if (!d.moved) return;
  const z = zoneAt(e.clientX, e.clientY);
  if (d.type === 'practice') {
    if (z && z.dataset.zone) practiceTap(z.dataset.zone);
    else G.practiceMsg = '把病患拖到一個診間';
    render();
  } else if (d.type === 'front') {
    if (z) decide(z.dataset.zone !== 'door', z.dataset.zone);
  } else if (d.type === 'cas') {
    const tz = zoneAt(e.clientX, e.clientY);
    if (tz && tz.dataset.zone) triage(d.idx, tz.dataset.zone);
    else { G.note = '把傷患拖到下方的檢傷色區'; render(); }
  } else if (d.type === 'cand') {
    const sd = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slotdrop]');
    if (sd) apptSend(d.idx, sd.dataset.slotdrop);
    else { G.note = '把候補病患拖到空缺時段'; render(); }
  } else if (d.type === 'slot') {
    const target = document.elementFromPoint(e.clientX, e.clientY)?.closest('[data-slot]');
    if (target) swapQueue(d.idx, +target.dataset.slot);
  }
});

  s3Slot: '空缺：{svc}｜{time}',
  s3Q: '你認為應該先向誰發送候補通知？',

const PT_TXT = PT.zh;
let P = null;      // 病患模式狀態；完整版的 G 完全不動
let PT_LAST = -1;
function ptFill(str, v) { return str.replace(/\{(\w+)\}/g, (_, k) => (v && v[k] !== undefined) ? v[k] : ''); }
function ptVars() { const k = P.pack; return {pt: k.pt, svc: k.svc, time: k.time, reason: k.reason, cancel: k.cancel, good: k.good.name}; }
function ptLookOf(name) {
  let h = 0; for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) % 997;
  return {color: PALETTE[h % PALETTE.length], hair: HAIRS[h % HAIRS.length]};
}
// 訊息氣泡：who 為 'staff' 時是櫃台，否則是病患（依名字決定外觀）
function ptMsg(who, name, text) {
  const isStaff = who === 'staff';
  const look = isStaff ? STAFF : ptLookOf(name);
  return `<div class="pt-msg ${isStaff ? 'staff' : ''}"><div class="pt-av">${avatar(look, 'neutral', 'sm')}</div>
    <div class="pt-bub"><span class="pt-name">${isStaff ? '櫃台' : name}</span>${text}</div></div>`;
}
function ptClear() { if (P && P.timer) clearTimeout(P.timer); }
function ptSchedule(ms, fn) {
  clearTimeout(P.timer);
  P.timer = setTimeout(() => { if (!P) return; fn(); render(); }, ms);
}
function ptAward(key, pts) { if (!P.got[key]) { P.got[key] = true; P.score += pts; } }
function patientStart() {
  ptClear();
  const pool = PT_PACKS.map((_, i) => i).filter(i => i !== PT_LAST);
  const idx = pool[Math.floor(Math.random() * pool.length)];
  PT_LAST = idx;
  P = {stage: 1, step: 'ask', pack: PT_PACKS[idx], score: 0, firstTry: 0, got: {}, wrong: '',
       s1Att: 0, s3Att: 0, timer: null,
       opts: shuffle(['confirm', 'ask', 'ignore']), cands: shuffle(['good', 'bad1', 'bad2'])};
  render();
}
function patientExit() { ptClear(); P = null; render(); }
function patientAct(k, v) {
  if (!P) return;
  if (k === 'exit' || k === 'full') return patientExit();
  if (k === 'replay') return patientStart();
  if (P.stage === 1) {
    if (k === 'choice') {
      const first = P.s1Att === 0; P.s1Att++;
      if (v === 'ask') { if (first) P.firstTry++; ptAward('understand', 10); P.wrong = ''; P.step = 'reply'; sfx('ok'); }
      else { P.wrong = ptFill(v === 'confirm' ? PT_TXT.s1ConfirmWhy : PT_TXT.s1IgnoreWhy, ptVars()); sfx('bad'); }
    } else if (k === 'record') { ptAward('cancel', 10); P.step = 'cancelled'; sfx('ok'); }
    else if (k === 'next') { P.stage = 2; P.step = 'show'; }
  } else if (P.stage === 2) {
    if (k === 'next') { P.stage = 3; P.step = 'ask'; }
  } else if (P.stage === 3) {
    if (k === 'cand') {
      const first = P.s3Att === 0; P.s3Att++;
      if (v === 'good') {
        if (first) P.firstTry++;
        ptAward('candidate', 10); P.wrong = ''; P.step = 'sending'; sfx('ok');
        ptSchedule(1500, () => {
          P.step = 'reply';
          ptSchedule(1500, () => { P.step = 'confirmed'; confetti(30); sfx('win'); });
        });
      } else { P.wrong = P.pack[v].why; sfx('bad'); }
    } else if (k === 'next') { ptAward('story', 10); P.stage = 4; }
  } else if (P.stage === 4) {
    if (k === 'next') P.stage = 5;
  }
}
function patientHTML() {
  if (P.stage === 5) return patientResultHTML();
  const dots = [1, 2, 3, 4].map(n => `<span class="pt-dot ${n <= P.stage ? 'on' : ''}"></span>`).join('');
  const body = [stage1HTML, stage2HTML, stage3HTML, stage4HTML][P.stage - 1]();
  return `<div class="pt-banner"><div><b>${PT_TXT.title}</b><small>${PT_TXT.progress} ${P.stage}／4</small></div><div class="pt-dots">${dots}</div></div>
    ${body}
    <div style="margin-top:14px"><button class="pt-sec" data-act="pt" data-k="exit">${PT_TXT.back}</button></div>`;
}
function stage1HTML() {
  const pk = P.pack, v = ptVars();
  if (P.step === 'ask') return `
    ${ptMsg('staff', '', ptFill(PT_TXT.s1Msg, v))}
    ${ptMsg('patient', pk.pt, ptFill(PT_TXT.s1Reply, v))}
    <p class="pt-q">${ptFill(PT_TXT.s1Q, v)}</p>
    ${P.opts.map((id, i) => `<button class="pt-opt" data-act="pt" data-k="choice" data-v="${id}"><span class="pt-letter">${'ABC'[i]}</span><span>${ptFill(PT_TXT['s1_' + id], v)}</span></button>`).join('')}
    ${P.wrong ? `<div class="pt-why">${P.wrong}</div>` : ''}`;
  if (P.step === 'reply') return `
    ${ptMsg('patient', pk.pt, pk.cancel)}
    <div class="pt-ok">${PT_TXT.s1Ok}</div>
    <button data-act="pt" data-k="record">${PT_TXT.s1RecordBtn}</button>`;
  return `
    <div class="pt-ok">${ptFill(PT_TXT.s1Recorded, v)}</div>
    <p class="muted">${PT_TXT.s1Lesson}</p>
    <button data-act="pt" data-k="next">${PT_TXT.next}</button>`;
}
function stage2HTML() {
  const v = ptVars();
  return `
    <div class="pt-slot on"><b>${ptFill(PT_TXT.s2Card, v)}</b><br><span class="muted">${PT_TXT.s2From}</span><br><span class="pt-tag">${PT_TXT.s2To}</span></div>
    <p>${ptFill(PT_TXT.s2Text, v)}</p>
    <p class="muted">${PT_TXT.s2Lesson}</p>
    <button data-act="pt" data-k="next">${PT_TXT.next}</button>`;
}
function stage3HTML() {
  const pk = P.pack, v = ptVars();
  const done = P.step === 'confirmed';
  const slot = `<div class="pt-slot ${done ? 'on' : ''}"><b>${ptFill(PT_TXT.s3Slot, v)}</b>${done ? `<br><span class="pt-tag">${PT_TXT.s3Confirmed}</span>` : ''}</div>`;
  if (P.step === 'ask') return `${slot}
    <p class="pt-q">${PT_TXT.s3Q}</p>
    ${P.cands.map(r => { const c = pk[r]; return `<button class="pt-opt" data-act="pt" data-k="cand" data-v="${r}">
      <span class="pt-letter">${'ABC'[P.cands.indexOf(r)]}</span>
      <span><b>${c.name}</b><br><small>${c.svc}｜${c.time}</small><br><span class="pt-badge ${c.consent ? 'ok' : 'warn'}">${c.consent ? '已同意數位通知' : '尚未授權數位通知'}</span></span></button>`; }).join('')}
    ${P.wrong ? `<div class="pt-why">${P.wrong}</div>` : ''}`;
  if (P.step === 'sending') return `${slot}
    <div class="pt-ok">${ptFill(PT_TXT.pedroSent, {name: pk.good.name})}</div><p class="muted">${PT_TXT.waiting}</p>`;
  if (P.step === 'reply') return `${slot}${ptMsg('patient', pk.good.name, pk.good.line)}<p class="muted">${PT_TXT.waiting}</p>`;
  return `${slot}${ptMsg('patient', pk.good.name, pk.good.line)}
    <div class="pt-ok">${PT_TXT.s3Confirmed}</div>
    <p class="muted">${PT_TXT.s3Lesson}</p>
    <button data-act="pt" data-k="next">${PT_TXT.next}</button>`;
}
function stage4HTML() {
  return `<div class="pt-hero"><div class="pt-chars">${avatar(ptLookOf(P.pack.pt), 'happy', 'sm')}${avatar(ptLookOf(P.pack.good.name), 'happy', 'sm')}${avatar(STAFF, 'happy', 'sm')}</div>
    <h2>${PT_TXT.s4Title}</h2>
    <ul class="pt-list">${PT_TXT.s4Results.map(x => `<li>${x}</li>`).join('')}</ul>
    <p>${PT_TXT.s4Text}</p><p class="muted">${PT_TXT.s4Fine}</p></div>
    <button data-act="pt" data-k="next">${PT_TXT.s4Btn}</button>`;
}
function patientResultHTML() {
  const score = `<p class="muted">${ptFill(PT_TXT.resScore, {s: P.score, m: 40})}<br>${ptFill(PT_TXT.resFirst, {f: P.firstTry})}</p>`;
  return `<div class="pt-hero"><div class="pt-chars">${avatar(ptLookOf(P.pack.pt), 'happy', 'sm')}${avatar(ptLookOf(P.pack.good.name), 'happy', 'sm')}${avatar(STAFF, 'happy', 'sm')}</div>
    <h2>${PT_TXT.resTitle}</h2><p>${PT_TXT.resSub}</p>
    <p>${PT_TXT.resAchieve}</p>${score}</div>
    <div class="card"><h3>${PT_TXT.resHeadline}</h3><p class="pt-es">${PT_TXT.resHeadlineEs}</p>
      <p>${PT_TXT.resBody}</p><p><b>${PT_TXT.resCore}</b></p><p class="pt-es">${PT_TXT.resCoreEs}</p></div>
    <div class="card">${PT_TXT.resCards.map((c, i) => `<div class="pt-step"><span class="pt-num">${i + 1}</span><div><b>${c.t}</b><div class="pt-es">${c.es}</div><p style="margin:4px 0 0">${c.d}</p></div></div>`).join('')}</div>
    <div class="card"><p>${PT_TXT.resSupport}</p></div>
    <div class="card"><h3>${PT_TXT.resDigital}</h3><p class="pt-es">${PT_TXT.resDigitalEs}</p>
      <p>${PT_TXT.resDigitalBody}</p><p class="muted">${PT_TXT.resProto}</p></div>
    <button data-act="pt" data-k="replay">${PT_TXT.resReplay}</button>
    <button class="pt-sec" data-act="pt" data-k="full">${PT_TXT.resFull}</button>
    <p class="muted center">${PT_TXT.disclaimer}</p>`;
}

/* ================= 開始 ================= */
$('#mute').textContent = soundOn ? '🔊' : '🔇';
newGame();
if (/[?&]mode=patient\b/.test(location.search)) patientStart();   // 掃 QR Code 直接進病患模式
setInterval(loop, 100);
</script>
